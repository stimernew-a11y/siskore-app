/* CALL */
const call = {active:false,peer:null,startedAt:0,tick:null,ring:null,
  localStream:null,pc:null,isCaller:false,roomId:null,pendingIce:[],
  sharing:false,screenStream:null,fpsRAF:null,screenFpsRAF:null};

function newPC(){
  const pc = new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});
  pc.onicecandidate = e => { if (e.candidate && call.roomId) emit('rtc_ice',{room:call.roomId,from:myUsername,candidate:e.candidate}); };
  pc.ontrack = e => {
    const stream = e.streams[0];
    const v = $('#callRemoteVideo');
    if (v && stream){
      v.srcObject = stream;
      if (stream.getVideoTracks().length){
        $('#callScreen').classList.add('show');
        $('#callAvatarWrap').style.display = 'none';
        startRemoteFps(v);
      }
    }
  };
  pc.onconnectionstatechange = ()=>{
    if (pc.connectionState === 'connected'){
      $('#callStatus').textContent = 'Соединено';
      $('#callOverlay').classList.remove('ringing');
      if (call.ring){ clearInterval(call.ring); call.ring = null; }
      if (!call.startedAt){ call.startedAt = Date.now(); $('#callTimer').style.display='block'; call.tick = setInterval(updateCallTimer, 250); sndJoin(); }
    }
  };
  return pc;
}
function startRemoteFps(v){
  let lastT = performance.now(), frames = 0;
  const tick = ()=>{
    frames++;
    const now = performance.now();
    if (now - lastT >= 1000){
      const el = $('#callFpsBadge'); if (el) el.textContent = Math.round((frames*1000)/(now-lastT)) + ' FPS';
      frames = 0; lastT = now;
    }
    if (v.requestVideoFrameCallback) call.fpsRAF = v.requestVideoFrameCallback(tick);
    else call.fpsRAF = requestAnimationFrame(tick);
  };
  if (v.requestVideoFrameCallback) v.requestVideoFrameCallback(tick);
  else requestAnimationFrame(tick);
}
function getMediaConstraints(){
  const c = {
    audio: {
      echoCancellation: userSettings.echoCancellation,
      noiseSuppression: userSettings.noiseSuppression,
      autoGainControl: userSettings.autoGainControl,
    },
    video: false,
  };
  if (userSettings.micDeviceId) c.audio.deviceId = { exact: userSettings.micDeviceId };
  return c;
}
async function startCall(peer){
  if (call.active) return;
  call.active = true; call.peer = peer;
  call.isCaller = true;
  call.roomId = 'call:' + [myUsername, peer.username].sort().join('|');
  call.pendingIce = [];
  $('#callAvatarSlot').innerHTML = avatarHTML(peer,'xxl',false);
  $('#callName').innerHTML = nameHTML(peer);
  $('#callStatus').textContent = 'Вызов...';
  $('#callTimer').style.display = 'none';
  $('#callScreen').classList.remove('show');
  $('#callAvatarWrap').style.display = 'flex';
  updateCallButtons();
  $('#callOverlay').classList.add('show','ringing');
  try{
    call.localStream = await navigator.mediaDevices.getUserMedia(getMediaConstraints());
    call.localStream.getAudioTracks().forEach(t => t.enabled = !userSettings.micMuted);
  }catch(e){ toast('Микрофон', e.message, 'error'); call.localStream = null; }
  sndRing(); call.ring = setInterval(sndRing, 3000);
  emit('rtc_invite',{room:call.roomId,from:myUsername,to:peer.username});
  call.pc = newPC();
  if (call.localStream) call.localStream.getTracks().forEach(t => call.pc.addTrack(t, call.localStream));
  else call.pc.addTransceiver('audio',{direction:'recvonly'});
  try{
    const offer = await call.pc.createOffer();
    await call.pc.setLocalDescription(offer);
    emit('rtc_offer',{room:call.roomId,from:myUsername,to:peer.username,sdp:offer});
  }catch(e){}
}
async function handleInvite(msg){
  if (call.active) return;
  const profile = getProfile(msg.from);
  call.active = true; call.peer = profile;
  call.isCaller = false; call.roomId = msg.room; call.pendingIce = [];
  $('#callAvatarSlot').innerHTML = avatarHTML(profile,'xxl',false);
  $('#callName').innerHTML = nameHTML(profile);
  $('#callStatus').textContent = 'Соединено';
  $('#callTimer').style.display = 'none';
  $('#callScreen').classList.remove('show');
  $('#callAvatarWrap').style.display = 'flex';
  updateCallButtons();
  $('#callOverlay').classList.add('show');
  try{
    call.localStream = await navigator.mediaDevices.getUserMedia(getMediaConstraints());
    call.localStream.getAudioTracks().forEach(t => t.enabled = !userSettings.micMuted);
  }catch(e){ call.localStream = null; }
  call.pc = newPC();
  if (call.localStream) call.localStream.getTracks().forEach(t => call.pc.addTrack(t, call.localStream));
  for (const c of call.pendingIce){ try{ await call.pc.addIceCandidate(c); }catch(e){} }
  call.pendingIce = [];
}
async function handleOffer(msg){
  if (!call.active || call.roomId !== msg.room || call.isCaller) return;
  try{
    await call.pc.setRemoteDescription(new RTCSessionDescription(msg.sdp));
    for (const c of call.pendingIce){ try{ await call.pc.addIceCandidate(c); }catch(e){} }
    call.pendingIce = [];
    const ans = await call.pc.createAnswer();
    await call.pc.setLocalDescription(ans);
    emit('rtc_answer',{room:call.roomId,from:myUsername,to:msg.from,sdp:ans});
  }catch(e){}
}
async function handleAnswer(msg){
  if (!call.active || !call.isCaller || call.roomId !== msg.room) return;
  try{
    await call.pc.setRemoteDescription(new RTCSessionDescription(msg.sdp));
    for (const c of call.pendingIce){ try{ await call.pc.addIceCandidate(c); }catch(e){} }
    call.pendingIce = [];
  }catch(e){}
}
async function handleIce(msg){
  if (!call.active || call.roomId !== msg.room) return;
  const cand = new RTCIceCandidate(msg.candidate);
  if (!call.pc || !call.pc.remoteDescription || !call.pc.remoteDescription.type){ call.pendingIce.push(cand); return; }
  try{ await call.pc.addIceCandidate(cand); }catch(e){}
}
function updateCallButtons(){
  const m = $('#btnMute'); if (m){ m.classList.toggle('off', userSettings.micMuted); }
  const d = $('#btnDeaf'); if (d){ d.classList.toggle('off', userSettings.headphoneMuted); }
  const s = $('#btnShare'); if (s){ s.classList.toggle('on-green', call.sharing); }
}
function updateCallTimer(){
  if (!call.startedAt) return;
  const s = Math.floor((Date.now() - call.startedAt)/1000);
  const m = Math.floor(s/60), sec = s%60;
  const el = $('#callTimerText'); if (el) el.textContent = `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
}
function endCall(silent){
  if (!call.active) return;
  const peer = call.peer;
  const dur = call.startedAt ? Math.floor((Date.now() - call.startedAt)/1000) : 0;
  const answered = call.startedAt > 0;
  clearInterval(call.ring); clearInterval(call.tick);
  if (call.fpsRAF){ const v = $('#callRemoteVideo'); if (v && v.cancelVideoFrameCallback) try{ v.cancelVideoFrameCallback(call.fpsRAF); }catch(e){} call.fpsRAF = null; }
  if (call.screenFpsRAF){ cancelAnimationFrame(call.screenFpsRAF); call.screenFpsRAF = null; }
  call.ring = null; call.tick = null;
  if (call.localStream) call.localStream.getTracks().forEach(t=>t.stop());
  if (call.screenStream) call.screenStream.getTracks().forEach(t=>t.stop());
  if (call.pc) try{ call.pc.close(); }catch(e){}
  emit('rtc_end',{room:call.roomId,from:myUsername});
  call.active = false; call.peer = null;
  call.localStream = null; call.screenStream = null; call.pc = null;
  call.startedAt = 0; call.roomId = null; call.pendingIce = [];
  call.sharing = false;
  $('#callOverlay').classList.remove('show','ringing');
  $('#callScreen').classList.remove('show');
  $('#callRemoteVideo').srcObject = null;
  $('#callAvatarWrap').style.display = 'flex';
  if (!silent) sndLeave();
  if (peer && answered && dur > 2){
    const mm = String(Math.floor(dur/60)).padStart(2,'0');
    const ss = String(dur%60).padStart(2,'0');
    appendMessage(convKeyDM(myUsername,peer.username),{
      id:uid(),from:myUsername,sys:true,text:`📞 Звонок завершён · ${mm}:${ss}`,time:Date.now(),
    });
    if (state.activeConv === convKeyDM(myUsername,peer.username)) renderMessages();
  }
}

$('#btnShare').onclick = async ()=>{
  if (call.sharing){
    if (call.screenStream){ call.screenStream.getTracks().forEach(t=>t.stop()); call.screenStream = null; }
    call.sharing = false; updateCallButtons(); return;
  }
  const fps = userSettings.screenFps || 75;
  try{
    const constraints = {
      video: { frameRate: { ideal: fps, max: fps }, cursor: 'motion' },

    };

    $('#callScreen').classList.add('show');
    $('#callAvatarWrap').style.display = 'none';
    v.srcObject = call.screenStream;
    let lastT = performance.now(), frames = 0;
    const tick = ()=>{
      frames++;
      const now = performance.now();
      if (now - lastT >= 1000){
        const el = $('#callFpsBadge');
        if (el) el.textContent = Math.round((frames*1000)/(now-lastT)) + ' FPS';
        frames = 0; lastT = now;
      }
      if (v.requestVideoFrameCallback) call.screenFpsRAF = v.requestVideoFrameCallback(tick);
      else call.screenFpsRAF = requestAnimationFrame(tick);
    };
    if (v.requestVideoFrameCallback) v.requestVideoFrameCallback(tick);
    else requestAnimationFrame(tick);
    if (call.pc){
      const sTrack = call.screenStream.getVideoTracks()[0];
      const sender = call.pc.getSenders().find(s => s.track && s.track.kind === 'video');
      if (sender) try{ await sender.replaceTrack(sTrack); }catch(e){ call.pc.addTrack(sTrack, call.screenStream); }
      else call.pc.addTrack(sTrack, call.screenStream);
      try{
        const offer = await call.pc.createOffer();
        await call.pc.setLocalDescription(offer);
        emit('rtc_offer',{room:call.roomId,from:myUsername,sdp:offer});
      }catch(e){}
    }
    call.screenStream.getVideoTracks()[0].onended = ()=> $('#btnShare').click();
    toast('Демонстрация', `${fps} FPS · 1080p`, 'success', 2500);
  }catch(e){
    if (e.name !== 'NotAllowedError' && e.name !== 'AbortError') toast('Ошибка', e.message, 'error');
  }
};
onBus(msg=>{
  if (!msg || !msg.type) return;
  switch(msg.type){
    case 'rtc_invite': if (msg.to === myUsername && msg.from !== myUsername) handleInvite(msg); break;
    case 'rtc_offer': if (msg.to === myUsername || call.roomId === msg.room) handleOffer(msg); break;
    case 'rtc_answer': if (msg.to === myUsername || call.roomId === msg.room) handleAnswer(msg); break;
    case 'rtc_ice': if (call.roomId === msg.room) handleIce(msg); break;
    case 'rtc_end': if (call.active && call.roomId === msg.room && msg.from !== myUsername) endCall(true); break;
  }
});

/* REALTIME */
onBus(msg=>{
  if (!msg) return;
  if (msg.type === 'new_message'){
    if (state && state.activeConv === msg.convKey) renderMessages();
    if (state && msg.convKey && msg.convKey.startsWith('dm:') && msg.convKey !== state.activeConv){
      const ids = msg.convKey.slice(3).split('|');
      if (ids.includes(myUsername)) sndMsg();
    }
  }
  if (msg.type === 'friend_request' && msg.to === myUsername){
    toast('Заявка в друзья', '@'+msg.from, 'success');
    renderSidebar();
    if (!state.activeConv && state.activeServer === null) renderMain();
  }
  if (msg.type === 'friend_added' && (msg.a === myUsername || msg.b === myUsername)){ renderSidebar(); renderMain(); }
  if (msg.type === 'friend_removed' && (msg.a === myUsername || msg.b === myUsername)) renderSidebar();
  if (msg.type === 'profile_update'){ renderSidebar(); if (state.activeConv) renderMessages(); }
  if (msg.type === 'storage'){
    if (msg.key === K.friends || msg.key === K.requests){ renderSidebar(); if (!state.activeConv) renderMain(); }
    if (msg.key === K.presence){ renderSidebar(); }
  }
});

/* ⚠️ FIX: Автосинхронизация каждые 3 секунды — заявки появятся даже если событие потерялось */
setInterval(()=>{
  if (!myUsername || !state) return;
  renderSidebar();
}, 3000);

/* NAV */
$('#homeBtn').onclick = ()=>{ state.activeServer = null; state.activeConv = null; saveState(); render(); };
$('#navFriends').onclick = ()=>{ state.activeServer = null; state.activeConv = null; saveState(); render(); };
$('#meInfo').onclick = ()=> openProfilePopout(state.me);
$('#meAvatarSlot').onclick = ()=> openProfileEditor();

/* AUTH SCREENS */
function showAuthScreen(view, data = {}){
  const el = $('#authScreen');
  el.classList.remove('hide');
  $('#app').classList.add('hide');
  if (view === 'login'){
    el.innerHTML = `
      <div class="auth-card">
        <h2>${t('welcome_back')}</h2>
        <p class="sub">${t('welcome_sub')}</p>
        <label>${t('username')}</label>
        <input id="lUser" placeholder="alex" autocomplete="username">
        <label>${t('password')}</label>
        <input id="lPass" type="password" placeholder="••••••••" autocomplete="current-password">
        <div class="err-text" id="lErr"></div>
        <button class="primary" id="loginBtn">${t('login')}</button>
        <div class="switch">${t('no_account')} <a id="toRegister">${t('register')}</a></div>
        ${langSwitchHTML()}
      </div>`;
    const submit = ()=>{
      const u = sanitizeUsername($('#lUser').value);
      const p = $('#lPass').value;
      const err = $('#lErr');
      if (!u || !p){ err.textContent = t('fill_fields'); return; }
      const user = auth.users[u];
      if (!user){ err.textContent = t('user_not_found'); return; }
      if (!checkPw(p, user.password)){ err.textContent = t('wrong_password'); return; }
      setSession(u); enterApp(u);
    };
    $('#loginBtn').onclick = submit;
    $('#lUser').addEventListener('keydown', e => { if (e.key === 'Enter') $('#lPass').focus(); });
    $('#lPass').addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
    $('#toRegister').onclick = ()=> showAuthScreen('register');
    wireLangSwitch();
    setTimeout(()=>$('#lUser').focus(), 100);
  }
  else if (view === 'register'){
    el.innerHTML = `
      <div class="auth-card">
        <h2>${t('create_account')}</h2>
        <p class="sub">${t('create_sub')}</p>
        <label>${t('email')}</label>
        <input id="rEmail" type="email" placeholder="you@example.com" autocomplete="email">
        <label>${t('username')}</label>
        <input id="rUser" placeholder="alex" autocomplete="username" maxlength="20">
        <label>${t('display_name')}</label>
        <input id="rName" placeholder="Александр" maxlength="24">
        <label>${t('password')}</label>
        <input id="rPass" type="password" placeholder="Минимум 6 символов" autocomplete="new-password">
        <div class="err-text" id="rErr"></div>
        <button class="primary" id="registerBtn">${t('continue')}</button>
        <div class="switch">${t('have_account')} <a id="toLogin">${t('login')}</a></div>
        ${langSwitchHTML()}
      </div>`;
    const submit = ()=>{
      const email = $('#rEmail').value.trim();
      const username = sanitizeUsername($('#rUser').value);
      const displayName = $('#rName').value.trim();
      const password = $('#rPass').value;
      const err = $('#rErr');
      if (!validEmail(email)){ err.textContent = t('invalid_email'); return; }
      if (!validUsername(username)){ err.textContent = t('username_rule'); return; }
      if (!displayName || displayName.length < 2){ err.textContent = t('name_short'); return; }
      if (!password || password.length < 6){ err.textContent = t('password_short'); return; }
      if (auth.users[username]){ err.textContent = t('user_taken'); return; }
      if (Object.values(auth.users).some(u => u.email.toLowerCase() === email.toLowerCase())){ err.textContent = t('email_taken'); return; }
      const code = String(Math.floor(100000 + Math.random()*900000));
      auth.pending = {email,username,displayName,password,code,expiresAt:Date.now()+10*60*1000};
      toast('Код подтверждения', `<b>${esc(email)}</b><br><span style="font-family:var(--mono);font-size:22px;font-weight:700;letter-spacing:6px;color:#00a8fc;display:block;text-align:center;margin-top:10px">${code}</span>`, 'success', 60000);
      showAuthScreen('verify', {email});
    };
    $('#registerBtn').onclick = submit;
    const order = ['#rEmail','#rUser','#rName','#rPass'];
    order.forEach((s,i)=>{ $(s).addEventListener('keydown', e=>{ if (e.key === 'Enter'){ if (i < order.length-1) $(order[i+1]).focus(); else submit(); } }); });
    $('#toLogin').onclick = ()=> showAuthScreen('login');
    wireLangSwitch();
    setTimeout(()=>$('#rEmail').focus(), 100);
  }
  else if (view === 'verify'){
    const email = data.email || auth.pending?.email || '';
    el.innerHTML = `
      <div class="auth-card">
        <h2>${t('verification')}</h2>
        <p class="sub">${t('verif_sub')} <b style="color:#f2f3f5">${esc(email)}</b></p>
        <div class="code-inputs" id="codeWrap">
          ${[0,1,2,3,4,5].map(i => `<input maxlength="1" inputmode="numeric">`).join('')}
        </div>
        <div class="err-text" id="vErr" style="text-align:center"></div>
        <button class="primary" id="verifyBtn">${t('confirm')}</button>
        <div class="switch"><a id="resendCode">${t('send_again')}</a> · <a id="backToReg">${t('back')}</a></div>
      </div>`;
    const inputs = $$('#codeWrap input');
    setTimeout(()=>inputs[0].focus(), 100);
    const submit = ()=>{
      const entered = inputs.map(i=>i.value).join('');
      const err = $('#vErr');
      if (!auth.pending){ err.textContent = 'Сессия истекла'; return; }
      if (Date.now() > auth.pending.expiresAt){ err.textContent = t('expired'); return; }
      if (entered !== auth.pending.code){ err.textContent = t('incorrect_code'); return; }
      const p = auth.pending;
      const tag = String(Math.floor(Math.random()*9000)+1000);
      const profile = defaultProfile(p.username, p.displayName);
      auth.users[p.username] = Object.assign(profile, {
        username:p.username, displayName:p.displayName, email:p.email,
        password:hashPw(p.password), tag, createdAt:Date.now(),
      });
      saveAuth();
      auth.pending = null;
      toast('Готово','Аккаунт создан','success');
      setSession(p.username);
      enterApp(p.username);
    };
    inputs.forEach((inp,i)=>{
      inp.addEventListener('input', ()=>{
        inp.value = inp.value.replace(/\D/g,'').slice(0,1);
        if (inp.value && i < 5) inputs[i+1].focus();
        if (inputs.every(x => x.value)) submit();
      });
      inp.addEventListener('keydown', e=>{ if (e.key === 'Backspace' && !inp.value && i > 0) inputs[i-1].focus(); });
    });
    $('#verifyBtn').onclick = submit;
    $('#backToReg').onclick = ()=>{ auth.pending = null; showAuthScreen('register'); };
    $('#resendCode').onclick = ()=>{
      if (!auth.pending) return;
      auth.pending.code = String(Math.floor(100000 + Math.random()*900000));
      auth.pending.expiresAt = Date.now() + 10*60*1000;
      toast('Новый код', `<span style="font-family:var(--mono);font-size:22px;font-weight:700;letter-spacing:6px;color:#00a8fc;display:block;text-align:center">${auth.pending.code}</span>`, 'success', 40000);
    };
  }
}
function langSwitchHTML(){
  return `<div class="lang-switch">
    <button data-lang="ru" class="${LANG==='ru'?'active':''}">RU</button>
    <button data-lang="en" class="${LANG==='en'?'active':''}">EN</button>
    <button data-lang="uk" class="${LANG==='uk'?'active':''}">UK</button>
  </div>`;
}
function wireLangSwitch(){
  $$('#authScreen [data-lang]').forEach(b => { b.onclick = ()=> setLang(b.dataset.lang); });
}
function setLang(lang){
  LANG = lang;
  writeJSON(K.lang, {lang});
  document.documentElement.lang = lang;
  if (myUsername && state){
    render();
    if ($('#peOverlay').classList.contains('show')) renderProfileEditor();
    if ($('#settingsOverlay').classList.contains('show')){ renderSettingsNav(); renderSettingsBody(); }
  } else {
    const isReg = !!$('#registerBtn');
    const isVer = !!$('#verifyBtn');
    showAuthScreen(isVer ? 'verify' : (isReg ? 'register' : 'login'), {email: auth.pending?.email});
  }
}

/* ENTER APP */
function enterApp(username){
  myUsername = username;
  loadStateFor(username);
  state.activeServer = null;
  state.activeConv = null;
  $('#authScreen').classList.add('hide');
  $('#app').classList.remove('hide');
  updatePresence();
  startPresenceTimer();
  render();
}

/* INIT */
(function init(){
  const langSaved = readJSON(K.lang, null);
  LANG = langSaved?.lang || 'ru';
  document.documentElement.lang = LANG;
  loadUserSettings();
  loadAuth();
  const sess = getSession();
  if (sess && auth.users[sess]) enterApp(sess);
  else { clearSession(); showAuthScreen('login'); }
})();

window.addEventListener('beforeunload', ()=>{ if (state) saveState(); if (call.active) endCall(true); });
</script>
