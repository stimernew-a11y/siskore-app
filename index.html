<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Siskore</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg-0:#1e1f22;--bg-1:#232428;--bg-2:#2b2d31;--bg-3:#313338;--bg-4:#383a40;--bg-5:#404249;
  --border:#1f2023;--border-2:#3f4147;
  --text:#f2f3f5;--text-2:#dbdee1;--text-3:#b5bac1;--text-4:#949ba4;--text-5:#6d6f78;
  --accent:#5865f2;--accent-h:#4752c4;--green:#23a55a;--yellow:#f0b232;--red:#f23f43;
  --mono:ui-monospace,'SF Mono',Menlo,monospace;
  --t-fast:.15s cubic-bezier(.2,.9,.3,1.1);
  --t-base:.22s cubic-bezier(.2,.9,.3,1.1);
  --t-slow:.35s cubic-bezier(.2,.9,.3,1.1);
  --t-spring:.4s cubic-bezier(.34,1.56,.64,1);
}
html,body{height:100%;overflow:hidden;background:var(--bg-3);color:var(--text-2);
  font-family:'gg sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  font-size:14px;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:inherit;
  transition:background-color var(--t-fast),color var(--t-fast),transform var(--t-fast),box-shadow var(--t-fast),opacity var(--t-fast)}
input,textarea,select{font-family:inherit;outline:none;border:none;font-size:inherit;
  transition:border-color var(--t-fast),background-color var(--t-fast),box-shadow var(--t-fast)}
a{color:#00a8fc;text-decoration:none;cursor:pointer}
a:hover{text-decoration:underline}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#1a1b1e;border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:#111214}
svg{display:block;flex-shrink:0}

@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
@keyframes slideInLeft{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:none}}
@keyframes slideInRight{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}}
@keyframes slideInUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
@keyframes scaleIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

/* ============ AUTH ============ */
#authScreen{position:fixed;inset:0;z-index:600;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(ellipse 80% 60% at 15% 10%,rgba(88,101,242,.18),transparent 60%),
    radial-gradient(ellipse 70% 60% at 85% 90%,rgba(0,168,252,.12),transparent 60%),#1e1f22;
  padding:20px;overflow:auto}
#authScreen.hide{display:none}
.auth-card{background:#313338;border-radius:8px;padding:32px;width:100%;max-width:480px;
  box-shadow:0 8px 32px rgba(0,0,0,.5);animation:pop .3s cubic-bezier(.2,.9,.3,1.1)}
.auth-card h2{font-size:24px;font-weight:600;color:#f2f3f5;text-align:center;margin-bottom:8px}
.auth-card .sub{font-size:15px;color:var(--text-4);text-align:center;margin-bottom:24px;line-height:1.4}
.auth-card label{display:block;font-size:12px;font-weight:700;color:var(--text-3);
  text-transform:uppercase;margin-bottom:8px;letter-spacing:.02em}
.auth-card input{width:100%;background:#1e1f22;color:var(--text);padding:10px 12px;border-radius:4px;
  font-size:15px;border:1px solid transparent;margin-bottom:20px}
.auth-card input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(88,101,242,.25);background:#1a1b1e}
.auth-card .primary{width:100%;background:var(--accent);color:#fff;padding:11px;border-radius:4px;
  font-size:15px;font-weight:500;margin-bottom:8px}
.auth-card .primary:hover{background:var(--accent-h);transform:translateY(-1px);box-shadow:0 6px 20px rgba(88,101,242,.4)}
.auth-card .primary:active{transform:translateY(0) scale(.98)}
.auth-card .switch{text-align:center;font-size:14px;color:var(--text-4);margin-top:8px}
.err-text{color:var(--red);font-size:13px;margin-bottom:8px;min-height:16px}
.err-text:not(:empty){animation:shake .3s ease}
.code-inputs{display:flex;gap:8px;justify-content:center;margin-bottom:20px}
.code-inputs input{width:56px!important;height:60px;text-align:center;font-size:24px;font-weight:600;
  margin-bottom:0!important;padding:0!important;font-family:var(--mono)}
.code-inputs input:focus{transform:translateY(-3px) scale(1.05)}
.lang-switch{display:flex;gap:6px;justify-content:center;margin-top:20px;padding-top:16px;border-top:1px solid #3f4147}
.lang-switch button{padding:6px 12px;border-radius:4px;font-size:12px;font-weight:600;
  color:var(--text-4);background:#2b2d31;border:1px solid #3f4147}
.lang-switch button.active{background:var(--accent);color:#fff;border-color:transparent}

/* ============ TOAST ============ */
#toast{position:fixed;top:20px;right:20px;z-index:1000;display:flex;flex-direction:column;gap:8px;max-width:380px}
.toast{background:#1e1f22;color:var(--text);padding:12px 16px;border-radius:8px;
  box-shadow:0 8px 24px rgba(0,0,0,.5);font-size:14px;border-left:3px solid var(--accent);
  animation:pop .3s cubic-bezier(.34,1.56,.64,1)}
.toast.success{border-left-color:var(--green)}
.toast.error{border-left-color:var(--red)}
.toast .t-title{font-weight:600;font-size:14px;margin-bottom:2px}
.toast .t-body{font-size:13px;color:var(--text-4);line-height:1.4;word-break:break-word}

/* ============ APP ============ */
#app{display:flex;height:100vh;width:100vw}
#app.hide{display:none}
#app:not(.hide){animation:fadeIn .3s ease}

.rail{width:72px;background:var(--bg-0);display:flex;flex-direction:column;align-items:center;
  padding:12px 0 0;gap:8px;flex-shrink:0;overflow-y:auto;overflow-x:hidden}
.rail::-webkit-scrollbar{display:none}
.rail-item{width:48px;height:48px;border-radius:16px;background:var(--bg-2);
  display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--text-4);
  position:relative;flex-shrink:0;overflow:hidden;cursor:pointer;font-weight:600}
.rail-item img{width:100%;height:100%;object-fit:cover;border-radius:inherit}
.rail-item:hover{border-radius:14px;background:var(--accent);color:#fff;transform:translateY(-2px)}
.rail-item.active{border-radius:14px;background:var(--accent);color:#fff}
.rail-item.active::before{content:'';position:absolute;left:-14px;top:50%;transform:translateY(-50%);
  width:4px;height:36px;background:#fff;border-radius:0 4px 4px 0}
.rail-sep{width:32px;height:2px;background:#2b2d31;border-radius:1px;flex-shrink:0;margin:2px 0}
.rail-add{color:var(--green);font-size:24px;font-weight:300;line-height:1}
.rail-add:hover{background:var(--green)!important;color:#fff!important}

.sidebar{width:240px;flex-shrink:0;background:var(--bg-2);display:flex;flex-direction:column}
.sidebar-top{padding:8px 10px}
.sidebar-search-btn{width:100%;background:#1e1f22;color:var(--text-4);padding:7px 10px;
  border-radius:4px;font-size:13px;text-align:left;font-weight:400;cursor:pointer}
.sidebar-search-btn:hover{color:var(--text-3);background:#18191c}
.sidebar-nav{padding:0 8px 8px}
.nav-item{display:flex;align-items:center;gap:12px;padding:7px 8px;border-radius:4px;
  cursor:pointer;font-size:14.5px;font-weight:500;color:var(--text-4);margin-bottom:1px}
.nav-item:hover{background:#35373c;color:var(--text-2)}
.nav-item.active{background:#404249;color:#fff}
.nav-item .ico{width:20px;text-align:center;display:flex;align-items:center;justify-content:center}
.sidebar-dms{flex:1;display:flex;flex-direction:column;min-height:0;padding:8px 8px 0;overflow:hidden}
.dms-header{display:flex;align-items:center;justify-content:space-between;padding:8px 8px 4px;
  font-size:11px;font-weight:700;color:var(--text-4);text-transform:uppercase;letter-spacing:.02em}
.dms-header .add-btn{color:var(--text-4);font-size:16px;font-weight:400;padding:0 4px;line-height:1;cursor:pointer}
.dms-header .add-btn:hover{color:var(--text)}
.dm-list{flex:1;overflow-y:auto;overflow-x:hidden;padding-right:2px}
.dm{display:flex;align-items:center;gap:12px;padding:6px 8px;border-radius:4px;cursor:pointer;
  position:relative;margin-bottom:1px;animation:slideInLeft .3s ease both}
.dm:hover{background:#35373c;transform:translateX(3px)}
.dm.active{background:#404249}
.dm-avatar{width:32px;height:32px;border-radius:50%;flex-shrink:0;position:relative;
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:#fff;overflow:hidden}
.dm:hover .dm-avatar{transform:scale(1.08)}
.dm-avatar img{width:100%;height:100%;object-fit:cover}
.dm-avatar .status-dot{position:absolute;right:-2px;bottom:-2px;width:12px;height:12px;border-radius:50%;
  border:3px solid var(--bg-2);background:#80848e}
.dm.active .dm-avatar .status-dot{border-color:#404249}
.dm:hover .dm-avatar .status-dot{border-color:#35373c}
.status-dot.online{background:var(--green)}
.status-dot.idle{background:var(--yellow)}
.status-dot.dnd{background:var(--red)}
.status-dot.offline{background:#80848e}
.dm-info{flex:1;min-width:0}
.dm-name{font-size:14px;font-weight:500;color:var(--text-4);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;line-height:1.2}
.dm.active .dm-name,.dm:hover .dm-name{color:var(--text-2)}
.dm-sub{font-size:11.5px;color:var(--text-5);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  line-height:1.3;margin-top:1px}
.dm-sub.online-text{color:var(--green)}
.dm-badge{margin-left:auto;background:var(--red);color:#fff;font-size:10px;font-weight:700;
  padding:2px 6px;border-radius:8px;min-width:18px;text-align:center}

.user-panel{height:52px;background:#232428;display:flex;align-items:center;gap:8px;
  padding:0 8px;flex-shrink:0;position:relative}
.user-panel .avatar-wrap{position:relative;cursor:pointer;flex-shrink:0}
.user-panel .avatar-wrap:hover{transform:scale(1.08)}
.user-panel .avatar-wrap .dm-avatar{width:32px;height:32px}
.user-panel-info{flex:1;min-width:0;cursor:pointer;padding:2px 4px;border-radius:3px}
.user-panel-info:hover{background:#35373c}
.user-panel-name{font-size:13px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;line-height:1.2}
.user-panel-tag{font-size:11px;color:var(--text-4);line-height:1.3}
.user-panel .icon-btn{width:32px;height:32px;border-radius:4px;display:flex;align-items:center;
  justify-content:center;color:var(--text-4);position:relative}
.user-panel .icon-btn:hover{background:#35373c;color:var(--text);transform:scale(1.1)}
.user-panel .icon-btn svg{width:18px;height:18px}
.user-panel .icon-btn.muted{color:var(--red)}
.user-panel .icon-btn.muted::after{content:'';position:absolute;width:22px;height:2px;
  background:var(--red);transform:rotate(-45deg);border-radius:2px}

.main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg-3)}
.main-header{height:48px;display:flex;align-items:center;gap:8px;padding:0 16px;
  border-bottom:1px solid var(--border);flex-shrink:0}
.main-tabs{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.main-tab{padding:4px 8px;font-size:14px;font-weight:500;color:var(--text-4);border-radius:4px;
  cursor:pointer;display:flex;align-items:center;gap:6px}
.main-tab:hover{color:var(--text-2);background:#35373c}
.main-tab.active{background:#404249;color:#fff}
.main-tab.primary{background:var(--accent);color:#fff;font-weight:500;margin-left:8px}
.main-tab.primary:hover{background:var(--accent-h);box-shadow:0 4px 12px rgba(88,101,242,.35)}
.main-tab.primary .plus{font-size:16px;font-weight:400;line-height:1}
.main-tab-sep{color:var(--text-5);padding:0 2px;user-select:none}
.main-header .header-icon-btn{width:32px;height:32px;border-radius:4px;display:flex;align-items:center;
  justify-content:center;color:var(--text-4);margin-left:auto}
.main-header .header-icon-btn:hover{background:#35373c;color:var(--text);transform:scale(1.08)}

.friends-content{flex:1;overflow-y:auto;padding:16px 24px}
.search-bar{position:relative;margin-bottom:16px}
.search-bar input{width:100%;background:#1e1f22;color:var(--text);padding:9px 12px 9px 34px;
  border-radius:4px;font-size:14px}
.search-bar input:focus{background:#1a1b1e;box-shadow:0 0 0 2px rgba(88,101,242,.25)}
.search-bar input::placeholder{color:var(--text-5)}
.search-bar::before{content:'';position:absolute;left:11px;top:50%;transform:translateY(-50%);
  width:16px;height:16px;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236d6f78' stroke-width='2' stroke-linecap='round'><circle cx='11' cy='11' r='7'/><path d='m21 21-4.3-4.3'/></svg>");
  background-size:contain;background-repeat:no-repeat;pointer-events:none}
.friends-section-title{font-size:12px;font-weight:600;color:var(--text-4);
  padding:12px 0 6px;letter-spacing:.01em}
.friend-row{display:flex;align-items:center;gap:14px;padding:10px 8px;border-radius:8px;
  cursor:pointer;margin-bottom:2px;border-top:1px solid transparent;
  animation:fadeUp .4s ease both}
.friend-row:hover{background:#35373c}
.friend-row + .friend-row{border-top:1px solid #2e3035;border-radius:0;margin-top:0;padding-top:14px}
.friend-row + .friend-row:hover{border-radius:8px;border-top-color:transparent}
.friend-row .avatar{width:40px;height:40px;border-radius:50%;flex-shrink:0;position:relative;
  display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;color:#fff;overflow:hidden}
.friend-row:hover .avatar{transform:scale(1.08)}
.friend-row .avatar img{width:100%;height:100%;object-fit:cover}
.friend-row .avatar .status-dot{position:absolute;right:-2px;bottom:-2px;width:14px;height:14px;
  border-radius:50%;border:3px solid var(--bg-3);background:#80848e}
.friend-row:hover .avatar .status-dot{border-color:#35373c}
.friend-info{flex:1;min-width:0}
.friend-name{font-size:15px;font-weight:600;color:var(--text);line-height:1.2;
  display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.friend-name .handle{font-size:12px;color:var(--text-4);font-weight:400;font-family:var(--mono)}
.friend-status{font-size:13px;color:var(--text-4);line-height:1.4;margin-top:1px}
.friend-actions{display:flex;gap:6px;opacity:0;transform:translateX(8px);transition:opacity var(--t-base),transform var(--t-base)}
.friend-row:hover .friend-actions{opacity:1;transform:none}
.friend-action-btn{width:36px;height:36px;border-radius:50%;background:#2b2d31;display:flex;
  align-items:center;justify-content:center;color:var(--text-2);cursor:pointer}
.friend-action-btn:hover{background:#3f4147;color:#fff;transform:scale(1.1) translateY(-1px)}
.friend-action-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:60px 20px;text-align:center;color:var(--text-4);gap:14px}
.empty-state .big{font-size:52px;opacity:.35;animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.empty-state .title{font-size:15px;font-weight:600;color:var(--text-3)}
.empty-state .hint{font-size:13px;color:var(--text-5);max-width:340px;line-height:1.5}

.right-panel{width:340px;flex-shrink:0;background:var(--bg-2);border-left:1px solid var(--border);
  display:flex;flex-direction:column}
.right-header{height:48px;display:flex;align-items:center;padding:0 16px;font-size:16px;font-weight:600;
  color:var(--text);border-bottom:1px solid var(--border);flex-shrink:0}
.right-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:32px 24px;text-align:center;gap:14px}
.right-empty .icon{width:64px;height:64px;border-radius:50%;background:#232428;display:flex;
  align-items:center;justify-content:center;color:var(--text-5);opacity:.6}
.right-empty .title{font-size:15px;font-weight:600;color:var(--text-3)}
.right-empty .desc{font-size:13px;color:var(--text-5);line-height:1.55;max-width:280px}

.chat-view{flex:1;display:flex;flex-direction:column;min-height:0;animation:fadeIn .25s ease}
.chat-head{height:48px;display:flex;align-items:center;gap:10px;padding:0 16px;
  border-bottom:1px solid var(--border);flex-shrink:0;background:var(--bg-3)}
.chat-head .avatar{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:11px;font-weight:600;color:#fff;flex-shrink:0;overflow:hidden}
.chat-head > div[data-profile]:hover .avatar{transform:scale(1.15)}
.chat-head .avatar img{width:100%;height:100%;object-fit:cover}
.chat-head .name{font-weight:600;font-size:15px;color:var(--text);display:flex;align-items:baseline;gap:8px}
.chat-head .handle{font-size:12px;color:var(--text-4);font-weight:400;font-family:var(--mono)}
.chat-head .sub{font-size:12px;color:var(--text-4);margin-top:1px}
.chat-head .head-actions{margin-left:auto;display:flex;gap:6px;align-items:center}
.chat-head .head-actions button{width:36px;height:36px;border-radius:4px;display:flex;align-items:center;
  justify-content:center;color:var(--text-4)}
.chat-head .head-actions button:hover{background:#35373c;color:var(--text);transform:scale(1.08)}

.messages{flex:1;overflow-y:auto;padding:16px 0 8px;scroll-behavior:smooth}
.msg{display:flex;gap:14px;padding:2px 20px;position:relative;animation:fadeUp .35s ease both}
.msg:hover{background:rgba(0,0,0,.05)}
.msg.group-start{margin-top:16px}
.msg .av-slot{width:40px;flex-shrink:0;display:flex;justify-content:center;cursor:pointer;padding-top:2px}
.msg .av-slot:hover{transform:scale(1.12)}
.msg-body{flex:1;min-width:0}
.msg-head{display:flex;align-items:baseline;gap:8px;margin-bottom:2px;flex-wrap:wrap}
.msg-author{font-weight:600;font-size:15px;color:var(--text);cursor:pointer}
.msg-author:hover{text-decoration:underline}
.msg-handle{font-size:11px;color:var(--text-5);font-family:var(--mono)}
.msg-time{font-size:11px;color:var(--text-5);font-family:var(--mono)}
.msg-text{font-size:15px;line-height:1.5;color:var(--text-2);word-wrap:break-word;white-space:pre-wrap}
.sys-msg{color:var(--text-4);font-size:13px;padding:6px 20px 6px 74px;font-style:italic}
.composer{padding:0 20px 22px}
.composer-inner{background:var(--bg-4);border-radius:8px;display:flex;align-items:flex-end;
  padding:0 14px;min-height:44px}
.composer-inner:focus-within{background:#40434a;box-shadow:0 0 0 1px rgba(88,101,242,.5)}
.composer textarea{flex:1;background:transparent;color:var(--text);font-size:15px;resize:none;
  padding:11px 0;max-height:200px;line-height:1.4;font-family:inherit}
.composer textarea::placeholder{color:var(--text-5)}
.send-btn{color:var(--accent);font-size:16px;padding:10px 0 10px 10px;opacity:0;color:var(--text-4);
  transform:translateX(-6px) scale(.85);transition:opacity var(--t-base),transform var(--t-spring),color var(--t-fast)}
.send-btn.show{opacity:1;transform:none}
.send-btn:hover{color:var(--accent);transform:scale(1.1)}

/* PROFILE EDITOR */
.pe-overlay{position:fixed;inset:0;z-index:400;background:var(--bg-3);display:none;flex-direction:column}
.pe-overlay.show{display:flex;animation:fadeIn .3s ease}
.pe-topbar{height:60px;flex-shrink:0;display:flex;align-items:center;padding:0 32px;
  border-bottom:1px solid var(--border);background:var(--bg-2)}
.pe-topbar .title{font-size:16px;font-weight:600;color:var(--text);flex:1}
.pe-btn{padding:8px 20px;border-radius:4px;font-size:14px;font-weight:500;
  background:transparent;color:var(--text-2);cursor:pointer;border:none}
.pe-btn:hover{background:#35373c}
.pe-btn.primary{background:var(--accent);color:#fff}
.pe-btn.primary:hover{background:var(--accent-h);box-shadow:0 4px 14px rgba(88,101,242,.4)}
.pe-layout{flex:1;display:grid;grid-template-columns:220px minmax(0,1fr) 420px;overflow:hidden}
@media(max-width:1200px){.pe-layout{grid-template-columns:200px 1fr}.pe-side-right{display:none}}
@media(max-width:800px){.pe-layout{grid-template-columns:1fr}.pe-side-left{display:none}}
.pe-side-left{background:var(--bg-2);border-right:1px solid var(--border);padding:20px 12px;overflow-y:auto}
.pe-cat{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:4px;
  cursor:pointer;font-size:14px;font-weight:500;color:var(--text-4);margin-bottom:2px;
  animation:slideInLeft .35s ease both}
.pe-cat:hover{background:#35373c;color:var(--text-2);padding-left:16px}
.pe-cat.active{background:#404249;color:#fff}
.pe-cat .ico{width:18px;text-align:center;display:flex;align-items:center;justify-content:center}
.pe-side-center{background:var(--bg-3);display:flex;flex-direction:column;
  align-items:center;padding:40px 24px;overflow-y:auto}
.pe-preview-label{font-size:11px;font-weight:700;text-transform:uppercase;
  color:var(--text-5);letter-spacing:.15em;margin-bottom:20px}
.pe-card{width:100%;max-width:460px;background:var(--bg-1);border-radius:12px;overflow:hidden;
  box-shadow:0 8px 32px rgba(0,0,0,.35);animation:scaleIn .4s cubic-bezier(.2,.9,.3,1.1) both}
.pe-card:hover{transform:translateY(-3px);box-shadow:0 14px 40px rgba(0,0,0,.45)}
.pe-card-banner{height:120px;position:relative;background:#5865f2;
  background-size:cover;background-position:center;overflow:hidden}
.pe-card-banner .pe-bg-anim{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.pe-card-body{padding:0 20px 24px;position:relative}
.pe-card-avatar{margin-top:-52px;margin-bottom:14px;display:inline-flex;position:relative;z-index:2}
.pe-card-avatar:hover{transform:scale(1.08) translateY(-3px)}
.pe-card-name{font-size:22px;font-weight:700;color:var(--text);letter-spacing:-.01em;line-height:1.2}
.pe-card-handle{font-size:13px;color:var(--text-4);font-family:var(--mono);margin-top:4px;display:block}
.pe-card-pron{font-size:12px;color:var(--text-4);margin-top:2px}
.pe-card-actions{display:flex;gap:8px;margin-top:16px;align-items:center}
.pe-card-btn{background:var(--accent);color:#fff;padding:8px 18px;border-radius:4px;
  font-size:13px;font-weight:500}
.pe-card-btn:hover{background:var(--accent-h);transform:translateY(-1px)}
.pe-card-icon-btn{width:36px;height:36px;border-radius:50%;background:#3f4147;display:flex;
  align-items:center;justify-content:center;color:var(--text-2);cursor:pointer}
.pe-card-icon-btn:hover{background:#4e5058;color:#fff;transform:scale(1.1)}
.pe-card-block{margin-top:18px;padding-top:18px;border-top:1px solid #3f4147}
.pe-card-block-title{font-size:11px;font-weight:700;text-transform:uppercase;
  color:var(--text-4);letter-spacing:.02em;margin-bottom:10px}
.pe-card-block-text{font-size:14px;color:var(--text-3);line-height:1.5;white-space:pre-wrap}
.pe-side-right{background:var(--bg-2);border-left:1px solid var(--border);padding:24px;overflow-y:auto;
  animation:slideInRight .4s ease both}
.pe-panel-title{font-size:16px;font-weight:600;color:var(--text);margin-bottom:6px}
.pe-panel-desc{font-size:13px;color:var(--text-4);margin-bottom:24px;line-height:1.5}
.pe-field{margin-bottom:20px;animation:fadeUp .35s ease both}
.pe-field-label{display:block;font-size:12px;font-weight:700;color:var(--text-3);
  text-transform:uppercase;letter-spacing:.02em;margin-bottom:8px}
.pe-input,.pe-textarea{width:100%;background:var(--bg-0);color:var(--text-2);
  padding:10px 12px;border-radius:4px;font-size:14px;border:1px solid transparent;font-family:inherit}
.pe-input:focus,.pe-textarea:focus{border-color:var(--accent);background:#1a1b1e;
  box-shadow:0 0 0 3px rgba(88,101,242,.18)}
.pe-textarea{resize:vertical;min-height:80px}
.pe-color-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pe-color{width:100%;height:38px;padding:3px;cursor:pointer;border-radius:4px;background:var(--bg-0);
  border:1px solid #1e1f22}
.pe-color:hover{transform:scale(1.03);border-color:var(--accent)}
.pe-hint{font-size:11px;color:var(--text-5);margin-top:6px;line-height:1.4}
.pe-upload{width:100%;padding:20px;border:2px dashed #3f4147;border-radius:8px;text-align:center;
  cursor:pointer;background:var(--bg-0)}
.pe-upload:hover{border-color:var(--accent);background:#1a1b1e;transform:translateY(-2px)}
.pe-upload.drag{border-color:var(--accent);background:rgba(88,101,242,.1);transform:scale(1.02)}
.pe-upload .up-ico{font-size:28px;margin-bottom:8px;opacity:.6}
.pe-upload:hover .up-ico{transform:scale(1.15) translateY(-3px);opacity:1}
.pe-upload .up-title{font-size:13px;font-weight:600;color:var(--text-2);margin-bottom:3px}
.pe-upload .up-hint{font-size:11px;color:var(--text-5)}
.pe-upload-preview{width:100%;aspect-ratio:1;border-radius:8px;background:#1e1f22;overflow:hidden;
  position:relative;margin-bottom:10px;border:1px solid #3f4147;animation:scaleIn .35s ease both}
.pe-upload-preview:hover{border-color:var(--accent);box-shadow:0 0 0 3px rgba(88,101,242,.15)}
.pe-upload-preview img{width:100%;height:100%;object-fit:cover;display:block}
.pe-upload-preview:hover img{transform:scale(1.05)}
.pe-upload-preview.banner{aspect-ratio:2.5/1}
.pe-upload-preview .ovl{position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.75),transparent 50%);
  display:flex;align-items:flex-end;justify-content:center;padding:8px;opacity:0}
.pe-upload-preview:hover .ovl{opacity:1}
.pe-upload-preview .ovl button{background:rgba(0,0,0,.75);color:#fff;padding:5px 12px;border-radius:4px;
  font-size:11px;font-weight:600;cursor:pointer;border:none}
.pe-upload-preview .ovl button:hover{background:var(--red);transform:translateY(-2px) scale(1.05)}
.pe-deco-tabs{display:flex;gap:4px;margin-bottom:14px;padding:3px;background:var(--bg-0);border-radius:6px}
.pe-deco-tabs button{flex:1;padding:6px 8px;border-radius:4px;font-size:12px;font-weight:600;
  color:var(--text-4);letter-spacing:.02em}
.pe-deco-tabs button.active{background:var(--accent);color:#fff}
.pe-deco-tabs button:hover:not(.active){color:var(--text-2)}
.pe-deco-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-height:340px;overflow-y:auto;padding:2px}
.pe-deco-item{aspect-ratio:1;border-radius:6px;background:var(--bg-0);border:2px solid transparent;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  cursor:pointer;padding:8px;position:relative;animation:scaleIn .3s ease both}
.pe-deco-item:hover{background:#1a1b1e;border-color:#3f4147;transform:translateY(-3px) scale(1.03)}
.pe-deco-item.active{border-color:var(--accent);background:rgba(88,101,242,.08)}
.pe-deco-item .demo{width:36px;height:36px;border-radius:50%;position:relative;
  background:linear-gradient(135deg,#5865f2,#00d9ff);--c1:#5865f2;--c2:#00d9ff;flex-shrink:0}
.pe-deco-item:hover .demo{transform:scale(1.1)}
.pe-deco-item .demo-label{font-size:9px;color:var(--text-5);text-align:center;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;width:100%}
.pe-deco-item.active .demo-label{color:var(--text-2);font-weight:600}
.pe-bg-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-height:340px;overflow-y:auto}
.pe-bg-item{aspect-ratio:16/10;border-radius:6px;background:#1e1f22;border:2px solid transparent;
  cursor:pointer;overflow:hidden;position:relative;animation:scaleIn .3s ease both}
.pe-bg-item:hover{border-color:#3f4147;transform:translateY(-3px) scale(1.03)}
.pe-bg-item.active{border-color:var(--accent)}
.pe-bg-item .pe-bg-anim{position:absolute;inset:0}
.pe-bg-item .pe-bg-label{position:absolute;bottom:0;left:0;right:0;padding:4px 6px;
  background:linear-gradient(0deg,rgba(0,0,0,.9),transparent);font-size:10px;font-weight:600;
  color:#fff;text-align:center}
.pe-games-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pe-game{aspect-ratio:16/9;border-radius:6px;overflow:hidden;position:relative;
  background:#1e1f22;border:1px solid #1e1f22;animation:scaleIn .3s ease both}
.pe-game:hover{transform:translateY(-3px) scale(1.03);border-color:#3f4147}
.pe-game img{width:100%;height:100%;object-fit:cover;display:block}
.pe-game:hover img{transform:scale(1.06)}
.pe-game .game-emoji{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:28px;color:rgba(255,255,255,.4)}
.pe-game .game-name{position:absolute;bottom:0;left:0;right:0;padding:4px 6px;
  background:linear-gradient(0deg,rgba(0,0,0,.95),transparent);font-size:10px;font-weight:600;
  color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pe-game-picker{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-height:400px;overflow-y:auto;padding:2px}
.pe-game-pick{aspect-ratio:16/9;border-radius:6px;overflow:hidden;cursor:pointer;position:relative;
  background:var(--bg-0);border:2px solid transparent;animation:scaleIn .3s ease both}
.pe-game-pick:hover{border-color:#3f4147;transform:translateY(-3px) scale(1.03)}
.pe-game-pick.active{border-color:var(--accent)}
.pe-game-pick.active::after{content:'✓';position:absolute;top:4px;right:4px;width:20px;height:20px;
  border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:700}
.pe-game-pick img{width:100%;height:100%;object-fit:cover;display:block}
.pe-game-pick .p-emoji{position:absolute;inset:0;display:flex;align-items:center;
  justify-content:center;font-size:24px;color:rgba(255,255,255,.4)}
.pe-game-pick .p-name{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(0deg,rgba(0,0,0,.95),transparent);
  padding:3px 5px;font-size:9.5px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* AVATAR DECORATIONS */
.av{position:relative;display:inline-flex;flex-shrink:0;--c1:#5865f2;--c2:#00d9ff;isolation:isolate}
.av > .avatar{position:relative;z-index:2;margin:auto}
.avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:600;color:#fff;flex-shrink:0;overflow:hidden;position:relative;z-index:2}
.avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.avatar.sm{width:26px;height:26px;font-size:11px}
.avatar.md{width:40px;height:40px;font-size:15px}
.avatar.lg{width:80px;height:80px;font-size:30px}
.avatar.xl{width:120px;height:120px;font-size:44px}
.avatar.xxl{width:96px;height:96px;font-size:34px}
.av-deco::before,.av-deco::after{content:'';position:absolute;top:50%;left:50%;
  width:calc(100% + 8px);height:calc(100% + 8px);transform:translate(-50%,-50%);
  border-radius:50%;pointer-events:none;z-index:1;opacity:0}
.deco-1d-ring::before{opacity:1;background:transparent;border:2px solid var(--c1)}
.deco-1d-ring-dash::before{opacity:1;background:transparent;border:2px dashed var(--c1);
  animation:spinCenter 8s linear infinite}
.deco-1d-ring-double::before{opacity:1;background:transparent;border:2px solid var(--c1)}
.deco-1d-ring-double::after{opacity:1;background:transparent;border:1px solid var(--c2);
  width:calc(100% + 18px);height:calc(100% + 18px)}
.deco-1d-ring-neon::before{opacity:1;background:transparent;border:2px solid var(--c1);
  box-shadow:0 0 8px var(--c1),0 0 16px var(--c1)}
.deco-1d-ring-gradient::before{opacity:1;background:conic-gradient(from 0deg,var(--c1),var(--c2),var(--c1));
  -webkit-mask:radial-gradient(circle,transparent 62%,#000 64%);
  mask:radial-gradient(circle,transparent 62%,#000 64%);
  border:none;animation:spinCenter 4s linear infinite}
.deco-1d-ring-thin::before{opacity:1;background:transparent;border:1px solid var(--c1);opacity:.7}
.deco-2d-stars::before{opacity:1;background:none;border:none;width:auto;height:auto;
  content:'✦';top:-8px;left:auto;right:-8px;transform:none;font-size:14px;color:#ffe066}
.deco-2d-hearts::before{opacity:1;background:none;border:none;width:auto;height:auto;
  content:'♥';top:-8px;right:-8px;left:auto;transform:none;font-size:13px;color:#ff4d94;
  animation:heartbeat 1.2s ease-in-out infinite}
.deco-2d-flames::before{opacity:1;background:none;border:none;width:auto;height:auto;
  content:'🔥';top:-13px;left:50%;transform:translateX(-50%);font-size:14px}
.deco-2d-crown::before{opacity:1;background:none;border:none;width:auto;height:auto;
  content:'♛';top:-15px;left:50%;transform:translateX(-50%);font-size:17px;color:#ffd700}
.deco-2d-cat::before{opacity:1;background:none;border:none;width:auto;height:auto;
  content:'🐱';top:-11px;left:-11px;transform:none;font-size:13px}
.deco-2d-sparkle::before{opacity:1;background:none;border:none;width:auto;height:auto;
  content:'✨';top:-9px;right:-8px;left:auto;transform:none;font-size:14px}
.deco-2d-diamond::before{opacity:1;background:none;border:none;width:auto;height:auto;
  content:'◆';top:-10px;right:-9px;left:auto;transform:none;font-size:13px;color:#00d9ff}
.deco-2d-lightning::before{opacity:1;background:none;border:none;width:auto;height:auto;
  content:'⚡';top:-11px;right:-8px;left:auto;transform:none;font-size:14px}
.deco-2d-snowflake::before{opacity:1;background:none;border:none;width:auto;height:auto;
  content:'❄';top:-11px;right:-8px;left:auto;transform:none;font-size:13px;color:#c9e3ff}
.deco-2d-flower::before{opacity:1;background:none;border:none;width:auto;height:auto;
  content:'🌸';top:-10px;right:-9px;left:auto;transform:none;font-size:13px}
.deco-2d-skull::before{opacity:1;background:none;border:none;width:auto;height:auto;
  content:'💀';top:-11px;right:-9px;left:auto;transform:none;font-size:13px}
.deco-2d-planet::before{opacity:1;background:none;border:none;width:auto;height:auto;
  content:'🪐';top:-11px;right:-10px;left:auto;transform:none;font-size:14px}
.deco-2d-moon::before{opacity:1;background:none;border:none;width:auto;height:auto;
  content:'🌙';top:-10px;right:-8px;left:auto;transform:none;font-size:13px}
.deco-2d-halo::before{opacity:1;background:none;border:none;width:auto;height:auto;
  content:'⭘';top:-15px;left:50%;transform:translateX(-50%);font-size:20px;color:#ffe066}
.deco-2d-fire-ring::before{opacity:1;background:conic-gradient(from 0deg,#ff5500,#ffbb00,#ff5500);
  -webkit-mask:radial-gradient(circle,transparent 60%,#000 62%);
  mask:radial-gradient(circle,transparent 60%,#000 62%);
  border:none;animation:spinCenter 3s linear infinite}
.deco-2d-ice-ring::before{opacity:1;background:conic-gradient(from 0deg,#88e0ff,#e0f6ff,#88e0ff);
  -webkit-mask:radial-gradient(circle,transparent 60%,#000 62%);
  mask:radial-gradient(circle,transparent 60%,#000 62%);
  border:none;animation:spinCenter 5s linear infinite}
.deco-2d-rainbow-ring::before{opacity:1;
  background:conic-gradient(from 0deg,#ff3b3b,#ff9d00,#ffe100,#2bd96a,#22c4ff,#8b5cff,#ff3bcf,#ff3b3b);
  -webkit-mask:radial-gradient(circle,transparent 60%,#000 62%);
  mask:radial-gradient(circle,transparent 60%,#000 62%);
  border:none;animation:spinCenter 4s linear infinite}
.deco-3d-orb::before{opacity:1;background:radial-gradient(circle at 30% 30%,var(--c1),var(--c2) 60%,#000 110%);
  -webkit-mask:radial-gradient(circle,transparent 60%,#000 62%);
  mask:radial-gradient(circle,transparent 60%,#000 62%);
  border:none;width:calc(100% + 12px);height:calc(100% + 12px);
  animation:spinCenter 8s linear infinite}
.deco-3d-cube::before{opacity:1;background:linear-gradient(135deg,var(--c1),var(--c2));border:none;
  width:calc(100% + 4px);height:calc(100% + 4px);border-radius:20%;
  animation:cubeSpin 4s linear infinite}
.deco-3d-prism::before{opacity:1;background:linear-gradient(135deg,var(--c1) 0%,transparent 50%,var(--c2) 100%);
  clip-path:polygon(50% 0%,100% 38%,82% 100%,18% 100%,0% 38%);
  border:none;width:calc(100% + 14px);height:calc(100% + 14px);
  animation:spinCenter 10s linear infinite}
.deco-3d-sphere::before{opacity:1;
  background:radial-gradient(circle at 25% 25%,rgba(255,255,255,.7),transparent 35%),
    radial-gradient(circle at 75% 75%,var(--c1),var(--c2));
  -webkit-mask:radial-gradient(circle,transparent 62%,#000 64%);
  mask:radial-gradient(circle,transparent 62%,#000 64%);
  border:none;width:calc(100% + 12px);height:calc(100% + 12px);
  animation:spinCenter 12s linear infinite}
.deco-3d-gyroscope::before{opacity:1;background:transparent;
  border:2px solid var(--c1);border-top-color:transparent;border-right-color:var(--c2);
  border-radius:50%;width:calc(100% + 12px);height:calc(100% + 12px);
  animation:spinCenter 2.5s linear infinite}
.deco-3d-gyroscope::after{opacity:1;background:transparent;
  border:1px solid var(--c2);border-bottom-color:transparent;border-left-color:var(--c1);
  border-radius:50%;width:calc(100% + 22px);height:calc(100% + 22px);
  animation:spinCenterRev 4s linear infinite}
.deco-3d-portal::before{opacity:1;
  background:conic-gradient(from 0deg,transparent,var(--c1),transparent 40%,var(--c2),transparent 80%,transparent);
  -webkit-mask:radial-gradient(circle,transparent 55%,#000 60%);
  mask:radial-gradient(circle,transparent 55%,#000 60%);
  border:none;width:calc(100% + 16px);height:calc(100% + 16px);
  animation:spinCenter 3s linear infinite}
.deco-3d-halo-3d::before{opacity:1;background:transparent;border:2px solid #ffe066;
  width:calc(100% + 4px);height:30%;border-radius:50%;top:-14px;left:50%;
  transform:translateX(-50%) rotateX(70deg);box-shadow:0 0 12px #ffe066;
  animation:haloSpin3d 4s linear infinite}
.deco-3d-neon-cube::before{opacity:1;background:linear-gradient(135deg,var(--c1),var(--c2));
  border-radius:15%;width:calc(100% + 6px);height:calc(100% + 6px);border:none;
  box-shadow:0 0 8px var(--c1),0 0 20px var(--c1),0 0 40px var(--c2);
  animation:cubeSpin 6s linear infinite}
.deco-3d-crystal-3d::before{opacity:1;
  background:conic-gradient(from 45deg,var(--c1) 0 25%,transparent 25% 50%,var(--c2) 50% 75%,transparent 75% 100%);
  clip-path:polygon(50% 0%,100% 50%,50% 100%,0% 50%);
  border:none;width:calc(100% + 12px);height:calc(100% + 12px);
  animation:spinCenter 6s linear infinite}
.deco-3d-ring-3d::before{opacity:1;background:transparent;border:3px solid var(--c1);
  border-radius:50%;width:calc(100% + 10px);height:calc(100% + 10px);
  animation:spinCenter 5s linear infinite;box-shadow:0 0 16px var(--c1)}

@keyframes spinCenter{from{transform:translate(-50%,-50%) rotate(0)}to{transform:translate(-50%,-50%) rotate(360deg)}}
@keyframes spinCenterRev{from{transform:translate(-50%,-50%) rotate(360deg)}to{transform:translate(-50%,-50%) rotate(0)}}
@keyframes heartbeat{0%,100%{transform:scale(1)}50%{transform:scale(1.35)}}
@keyframes cubeSpin{from{transform:translate(-50%,-50%) rotate(0)}to{transform:translate(-50%,-50%) rotate(360deg)}}
@keyframes haloSpin3d{from{transform:translateX(-50%) rotateX(70deg) rotateZ(0)}to{transform:translateX(-50%) rotateX(70deg) rotateZ(360deg)}}

.av-frame{position:relative;display:inline-flex;padding:3px;border-radius:50%}
.av-frame::before{content:'';position:absolute;inset:0;border-radius:50%;pointer-events:none;z-index:1;opacity:0}
.frame-glow::before{opacity:1;box-shadow:0 0 20px var(--c1);border:2px solid var(--c1)}
.frame-neon::before{opacity:1;border:2px solid var(--c1);box-shadow:0 0 8px var(--c1)}
.frame-gold::before{opacity:1;border:3px solid #ffd700}
.frame-rainbow::before{opacity:1;
  background:conic-gradient(from 0deg,#ff3b3b,#ff9d00,#ffe100,#2bd96a,#22c4ff,#8b5cff,#ff3bcf,#ff3b3b);
  -webkit-mask:radial-gradient(circle,transparent 70%,#000 72%);
  mask:radial-gradient(circle,transparent 70%,#000 72%);animation:spinCenter 5s linear infinite}
.frame-fire::before{opacity:1;background:conic-gradient(from 0deg,#ff5500,#ffbb00,#ff5500);
  -webkit-mask:radial-gradient(circle,transparent 68%,#000 70%);
  mask:radial-gradient(circle,transparent 68%,#000 70%);animation:spinCenter 3s linear infinite}
.frame-ice::before{opacity:1;background:conic-gradient(from 0deg,#88e0ff,#e0f6ff,#88e0ff);
  -webkit-mask:radial-gradient(circle,transparent 68%,#000 70%);
  mask:radial-gradient(circle,transparent 68%,#000 70%);animation:spinCenter 6s linear infinite}
.frame-hexagon::before{opacity:1;background:conic-gradient(from 0deg,var(--c1),var(--c2),var(--c1));
  clip-path:polygon(50% 0%,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%);animation:spinCenter 8s linear infinite}
.frame-pulse::before{opacity:1;border:2px solid var(--c1);animation:frameRingPulse 1.8s ease-in-out infinite}
@keyframes frameRingPulse{0%{transform:scale(1);opacity:1}100%{transform:scale(1.15);opacity:0}}

.ne-rainbow{background:linear-gradient(90deg,#ff3b3b,#ff9d00,#ffe100,#2bd96a,#22c4ff,#8b5cff,#ff3bcf,#ff3b3b);

/* SETTINGS */
.settings-overlay{position:fixed;inset:0;background:var(--bg-2);z-index:200;display:none;flex-direction:row}
.settings-overlay.show{display:flex;animation:fadeIn .28s ease}
.settings-nav{width:240px;flex-shrink:0;background:var(--bg-0);display:flex;flex-direction:column;
  padding:60px 8px 16px;overflow-y:auto}
.settings-nav-item{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:4px;
  font-size:14px;font-weight:500;color:var(--text-4);cursor:pointer;margin-bottom:1px;
  animation:slideInLeft .35s ease both}
.settings-nav-item:hover{background:#35373c;color:var(--text-2);padding-left:14px}
.settings-nav-item.active{background:#404249;color:#fff}
.settings-nav-section{font-size:11px;font-weight:700;text-transform:uppercase;color:var(--text-4);
  letter-spacing:.02em;padding:16px 10px 6px}
.settings-content{flex:1;overflow-y:auto;padding:60px 40px 40px;position:relative}
.settings-close{position:absolute;top:20px;right:24px;width:36px;height:36px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;color:var(--text-4);font-size:20px;
  border:1px solid #3f4147;cursor:pointer}
.settings-close:hover{background:#35373c;color:var(--text);transform:rotate(90deg)}
.settings-body{max-width:740px;margin:0 auto}
.settings-title{font-size:20px;font-weight:600;color:var(--text);margin-bottom:20px}
.settings-row{display:flex;align-items:center;gap:16px;padding:14px 0;border-bottom:1px solid #3f4147}
.settings-row:last-child{border-bottom:none}
.settings-row-label{flex:1;font-size:14px;color:var(--text-2);font-weight:500}
.settings-row-label .sub{display:block;font-size:12px;color:var(--text-4);margin-top:3px;font-weight:400}
.settings-btn{padding:8px 16px;border-radius:4px;background:var(--accent);color:#fff;font-size:13px;
  font-weight:500;border:none;white-space:nowrap;cursor:pointer}
.settings-btn:hover{background:var(--accent-h);transform:translateY(-1px);box-shadow:0 4px 12px rgba(88,101,242,.35)}
.settings-btn.ghost{background:transparent;color:var(--text-2);border:1px solid #3f4147}
.settings-btn.ghost:hover{background:#35373c}
.settings-btn.danger{background:var(--red)}
.settings-select{background:#1e1f22;color:var(--text-2);padding:8px 12px;border-radius:4px;
  border:1px solid #3f4147;font-size:14px;min-width:240px;cursor:pointer}
.settings-select:focus{border-color:var(--accent)}
.mic-meter{width:180px;height:10px;background:#1e1f22;border-radius:5px;overflow:hidden;border:1px solid #3f4147}
.mic-meter-fill{height:100%;width:0%;background:linear-gradient(90deg,#23a55a,#00d9ff);transition:width .06s linear}
.switch{position:relative;display:inline-block;width:40px;height:22px;flex-shrink:0}
.switch input{opacity:0;width:0;height:0}
.switch .slider{position:absolute;cursor:pointer;inset:0;background:#4e5058;transition:background var(--t-base);border-radius:22px}
.switch .slider::before{content:'';position:absolute;height:18px;width:18px;left:2px;bottom:2px;
  background:#fff;transition:transform var(--t-spring);border-radius:50%;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch input:checked + .slider{background:var(--green)}
.switch input:checked + .slider::before{transform:translateX(18px)}
.camera-preview{background:#1e1f22;border-radius:8px;overflow:hidden;aspect-ratio:16/9;max-width:480px;
  position:relative;display:flex;align-items:center;justify-content:center;border:1px solid #3f4147;margin-top:12px}
.camera-preview video{width:100%;height:100%;object-fit:cover;display:none}
.camera-preview.live{border-color:var(--green);box-shadow:0 0 0 3px rgba(35,165,90,.15)}
.camera-preview.live video{display:block;animation:fadeIn .4s ease}
.camera-preview.live .cam-ph{display:none}
.camera-preview .cam-ph{color:var(--text-5);text-align:center}
.camera-preview .fps-badge{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.75);

.camera-preview.live .fps-badge{display:block}

/* MODAL */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;
  justify-content:center;z-index:300;padding:20px;overflow-y:auto}
.backdrop.show{display:flex;animation:fadeIn .25s ease}
.modal{background:#313338;border-radius:8px;padding:24px;width:100%;max-width:460px;max-height:90vh;
  overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.6);margin:auto;
  animation:pop .35s cubic-bezier(.34,1.56,.64,1)}
.modal h2{font-size:20px;font-weight:600;color:var(--text);margin-bottom:8px;text-align:center}
.modal .hint{font-size:14px;color:var(--text-4);margin-bottom:20px;text-align:center;line-height:1.4}
.modal label{display:block;font-size:12px;font-weight:700;color:var(--text-3);
  text-transform:uppercase;letter-spacing:.02em;margin-bottom:8px}
.modal input,.modal textarea,.modal select{width:100%;background:#1e1f22;color:var(--text-2);
  padding:10px 12px;border-radius:4px;font-size:14px;border:1px solid transparent;
  margin-bottom:16px;font-family:inherit}
.modal input:focus,.modal textarea:focus,.modal select:focus{border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(88,101,242,.18)}
.modal .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;flex-wrap:wrap}
.btn{padding:9px 20px;border-radius:4px;font-size:14px;font-weight:500;cursor:pointer;
  border:none;background:transparent;color:var(--text-2)}
.btn:hover{background:#35373c;transform:translateY(-1px)}
.btn.primary{background:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-h);box-shadow:0 4px 14px rgba(88,101,242,.4)}
.btn.danger{background:var(--red);color:#fff}

/* CALL */
.call-overlay{position:fixed;inset:0;z-index:250;background:#000;display:none;flex-direction:column;
  align-items:center;justify-content:center;gap:24px;padding:20px}
.call-overlay.show{display:flex;animation:fadeIn .3s ease}
.call-avatar-wrap{position:relative;display:flex;align-items:center;justify-content:center;padding:20px;animation:scaleIn .4s ease both}
.call-avatar-wrap .ring{position:absolute;width:170px;height:170px;border-radius:50%;
  border:2px solid var(--accent);opacity:0}
.call-overlay.ringing .ring{animation:pulseRing 1.8s infinite}
.call-overlay.ringing .ring:nth-child(2){animation-delay:.6s}
@keyframes pulseRing{0%{transform:scale(.9);opacity:.8}100%{transform:scale(1.7);opacity:0}}
.call-name{font-size:28px;font-weight:600;color:#fff;text-align:center;margin-bottom:6px}
.call-status{font-size:14px;color:#b9bbbe;text-align:center}
.call-timer{font-size:14px;color:#23a55a;font-family:var(--mono);margin-top:8px;text-align:center}
.call-screen{width:90%;max-width:1200px;aspect-ratio:16/9;background:#0a0a0a;border-radius:8px;
  overflow:hidden;border:1px solid #2b2d31;position:relative;display:none}
.call-screen.show{display:block;animation:scaleIn .4s ease both}
.call-screen video{width:100%;height:100%;object-fit:contain;display:block}
.call-screen .fps-badge{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.75);
  padding:4px 10px;border-radius:4px;font-size:12px;font-family:var(--mono);color:#00d9ff}
.call-controls{display:flex;gap:14px;margin-top:10px;flex-wrap:wrap;justify-content:center}
.call-btn{width:56px;height:56px;border-radius:50%;background:#2b2d31;display:flex;align-items:center;
  justify-content:center;font-size:22px;color:#fff;border:none;cursor:pointer;position:relative}
.call-btn:hover{background:#3f4147;transform:translateY(-3px) scale(1.05);box-shadow:0 8px 20px rgba(0,0,0,.5)}
.call-btn.off{background:#fff;color:#111}
.call-btn.off::after{content:'';position:absolute;width:32px;height:3px;background:#f23f43;
  transform:rotate(-45deg);border-radius:2px;box-shadow:0 0 3px #000}
.call-btn.end{background:var(--red)}
.call-btn.end:hover{background:#c93a3d}
.call-btn.on-green{background:var(--green)}

.hidden{display:none!important}
@media(max-width:1000px){.right-panel{display:none}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

let actx = null;
function beep(f=440,d=.12,ty='sine',v=.05){
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = ty; o.frequency.value = f;
    o.connect(g); g.connect(actx.destination);
    g.gain.setValueAtTime(v, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001, actx.currentTime + d);
    o.start(); o.stop(actx.currentTime + d);
  }catch(e){}
}
const sndMsg = () => { beep(880,.08,'sine',.04); setTimeout(()=>beep(1320,.08,'sine',.035),65); };
const sndJoin = () => { beep(660,.12,'sine',.05); setTimeout(()=>beep(990,.18,'sine',.045),110); };
const sndLeave = () => { beep(500,.12,'sine',.045); setTimeout(()=>beep(330,.2,'sine',.045),110); };
const sndRing = () => { beep(560,.35,'triangle',.045); setTimeout(()=>beep(720,.35,'triangle',.045),420); };

function toast(title, body, type='', dur=4500){
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.innerHTML = `<div class="t-title">${esc(title)}</div>${body ? `<div class="t-body">${body}</div>` : ''}`;
  $('#toast').appendChild(el);
  setTimeout(()=>{
    el.style.transition='opacity .3s ease,transform .3s ease';
    el.style.opacity='0'; el.style.transform='translateX(120%)';
    setTimeout(()=>el.remove(),320);
  }, dur);
}

function avatarHTML(u, size='', showDot=false, dotBorder='var(--bg-2)'){
  if (!u) return '';
  const c1 = u.avatarColor1||'#5865f2', c2 = u.avatarColor2||'#00d9ff';
  const bg = `linear-gradient(135deg,${c1},${c2})`;
  const tier = getTier(u.decoration);
  const deco = u.decoration && u.decoration !== 'none' ? ` av-deco deco-${tier}-${u.decoration}` : '';
  const frame = u.frame && u.frame !== 'none' ? ' av-frame frame-'+u.frame : '';
  let inner;
  if (u.avatarData) inner = `<div class="avatar ${size}" style="background:${bg}"><img src="${esc(u.avatarData)}" alt=""></div>`;
  else if (u.avatarEmoji) inner = `<div class="avatar ${size}" style="background:${bg}">${esc(u.avatarEmoji)}</div>`;
  else inner = `<div class="avatar ${size}" style="background:${bg}">${esc(initials(u.displayName||u.username))}</div>`;
  const dot = showDot && u.status ? `<div class="status-dot ${u.status}" style="border-color:${dotBorder}"></div>` : '';
  return `<div class="av${deco}${frame}" style="--c1:${u.nameColor1||c1};--c2:${u.nameColor2||c2}">${inner}${dot}</div>`;
}
function nameHTML(u, fallback){
  if (!u) return '?';

}

function saveState(){
  if (!state || !myUsername) return;
  clearTimeout(saveT);
  saveT = setTimeout(()=>{
    if (auth.users[myUsername]){
      const u = auth.users[myUsername];
      Object.assign(u, {
        displayName:state.me.displayName,
        avatarColor1:state.me.avatarColor1, avatarColor2:state.me.avatarColor2,
        avatarData:state.me.avatarData, bannerData:state.me.bannerData,
        avatarEmoji:state.me.avatarEmoji, decoration:state.me.decoration,
        frame:state.me.frame, profileEffect:state.me.profileEffect, nameEffect:state.me.nameEffect,
        nameColor1:state.me.nameColor1, nameColor2:state.me.nameColor2,
        bannerColor1:state.me.bannerColor1, bannerColor2:state.me.bannerColor2,
        bio:state.me.bio, pronouns:state.me.pronouns, customStatus:state.me.customStatus,
        status:state.me.status, favGames:state.me.favGames,
      });
      saveAuth();
    }
    const all = stateStorage();
    all[myUsername] = state;
    writeJSON(K.states, all);
    const p = readJSON(K.presence, {});
    p[myUsername] = Date.now();
    writeJSON(K.presence, p);
    emit('profile_update',{username:myUsername});
  }, 200);
}

const allMessages = () => readJSON(K.messages, {});
const setAllMessages = m => writeJSON(K.messages, m);
const allFriends = () => readJSON(K.friends, {});
const setAllFriends = f => writeJSON(K.friends, f);
const convKeyDM = (a,b) => 'dm:' + [a,b].sort().join('|');
const convKeyChannel = id => 'ch:' + id;
const getMessages = k => allMessages()[k] || [];
function appendMessage(k,msg){
  const all = allMessages();
  if (!all[k]) all[k] = [];
  all[k].push(msg);
  setAllMessages(all);
  emit('new_message',{convKey:k,id:msg.id});
}
const getFriendsList = u => allFriends()[u] || [];
function addFriendRelation(a,b){
  const f = allFriends();
  if (!f[a]) f[a]=[]; if (!f[b]) f[b]=[];
  if (!f[a].includes(b)) f[a].push(b);
  if (!f[b].includes(a)) f[b].push(a);
  setAllFriends(f); emit('friend_added',{a,b});
}
function removeFriendRelation(a,b){
  const f = allFriends();
  if (f[a]) f[a] = f[a].filter(x => x!==b);
  if (f[b]) f[b] = f[b].filter(x => x!==a);
  setAllFriends(f); emit('friend_removed',{a,b});
}
function isOnline(username){
  const p = readJSON(K.presence,{});
  const ts = p[username];
  return ts && (Date.now()-ts < 25000);
}
function updatePresence(){
  if (!myUsername) return;
  const p = readJSON(K.presence,{});
  p[myUsername] = Date.now();
  writeJSON(K.presence,p);
}
let presenceTimer = null;
function startPresenceTimer(){
  if (presenceTimer) clearInterval(presenceTimer);
  presenceTimer = setInterval(updatePresence, 8000);
}
const allRequests = () => readJSON(K.requests,{});
const setAllRequests = r => writeJSON(K.requests,r);
function sendRequest(from,to){
  const r = allRequests();
  if (!r[to]) r[to]=[];
  if (!r[to].some(x => x.from === from)) r[to].push({from,time:Date.now()});
  setAllRequests(r); emit('friend_request',{from,to});
}
function acceptRequest(from,to){
  const r = allRequests();
  if (r[to]) r[to] = r[to].filter(x => x.from !== from);
  setAllRequests(r); addFriendRelation(from,to);
}
function declineRequest(from,to){
  const r = allRequests();
  if (r[to]) r[to] = r[to].filter(x => x.from !== from);
  setAllRequests(r); emit('request_declined',{from,to});
}
function getProfile(username){
  if (state && state.me.username === username) return state.me;
  const u = auth.users[username];
  if (u){
    const p = Object.assign(defaultProfile(username, u.displayName), u, {username});
    p.status = isOnline(username) ? (u.status||'online') : 'offline';
    return p;
  }
  const all = stateStorage();
  if (all[username]?.me) return all[username].me;
  return defaultProfile(username, username);
}

/* FILE → BASE64 */
function fileToDataUrl(file, maxDim, cb){
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    const src = reader.result;
    if (file.type === 'image/svg+xml' || file.size < 150*1024){ cb(src); return; }
    const img = new Image();
    img.onload = () => {
      let w = img.width, h = img.height;
      if (w > maxDim || h > maxDim){
        if (w > h){ h = Math.round(h * maxDim / w); w = maxDim; }
        else { w = Math.round(w * maxDim / h); h = maxDim; }
      }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      try{
        if (file.type === 'image/gif') cb(src);
        else if (file.type === 'image/png' || file.type === 'image/webp') cb(canvas.toDataURL('image/png', 0.9));
        else cb(canvas.toDataURL('image/jpeg', 0.85));
      }catch(e){ cb(src); }
    };
    img.onerror = () => cb(src);
    img.src = src;
  };
  reader.readAsDataURL(file);
}

/* RENDER */
function render(){
  if (!state) return;
  renderRail(); renderSidebar(); renderMain(); renderMe();
}
function renderMe(){
  $('#meAvatarSlot').innerHTML = avatarHTML(state.me, 'sm', true, '#232428');
  $('#meName').textContent = state.me.displayName;
  $('#meTag').textContent = '@' + state.me.username;
  $('#micQuick').classList.toggle('muted', userSettings.micMuted);
}
function renderRail(){
  const list = $('#serverList');
  list.innerHTML = '';
  state.servers.forEach(s=>{
    const el = document.createElement('div');
    el.className = 'rail-item' + (state.activeServer === s.id ? ' active' : '');
    if (s.iconUrl) el.innerHTML = `<img src="${esc(s.iconUrl)}" alt="">`;
    else el.textContent = s.emoji || initials(s.name);
    el.title = s.name;
    el.onclick = ()=>{
      state.activeServer = s.id;
      const first = s.channels[0];
      state.activeConv = first ? convKeyChannel(first.id) : null;
      saveState(); render();
    };
    list.appendChild(el);
  });
  $('#homeBtn').classList.toggle('active', state.activeServer === null);
}
function renderSidebar(){
  const list = $('#dmList');
  list.innerHTML = '';
  const reqs = allRequests()[myUsername] || [];
  if (reqs.length){
    reqs.forEach(r=>{
      const p = getProfile(r.from);
      const el = document.createElement('div');
      el.className = 'dm';
      el.innerHTML = `
        ${avatarHTML(p,'sm',true,'var(--bg-2)')}
        <div class="dm-info">
          <div class="dm-name">${nameHTML(p)}</div>
          <div class="dm-sub" style="color:var(--yellow)">Заявка в друзья</div>
        </div>
        <div style="display:flex;gap:4px;margin-left:auto">
          <button data-accept style="color:var(--green);font-size:16px;padding:2px 6px">✓</button>
          <button data-decline style="color:var(--red);font-size:16px;padding:2px 6px">✕</button>
        </div>`;
      el.querySelector('[data-accept]').onclick = (e)=>{ e.stopPropagation(); acceptRequest(r.from,myUsername); toast('✓','@'+r.from,'success'); renderSidebar(); };
      el.querySelector('[data-decline]').onclick = (e)=>{ e.stopPropagation(); declineRequest(r.from,myUsername); renderSidebar(); };
      list.appendChild(el);
    });
  }
  const friends = getFriendsList(myUsername);
  if (!friends.length && !reqs.length){
    const d = document.createElement('div');
    d.style.cssText = 'padding:20px 8px;font-size:13px;color:var(--text-5);text-align:center;line-height:1.5';
    d.textContent = t('no_friends');
    list.appendChild(d);
    return;
  }
  [...friends].sort((a,b)=>(isOnline(b)?1:0)-(isOnline(a)?1:0)).forEach(u=>{
    const p = getProfile(u);
    const key = convKeyDM(myUsername,u);
    const online = isOnline(u);
    const el = document.createElement('div');
    el.className = 'dm' + (state.activeConv === key ? ' active' : '');
    el.innerHTML = `
      ${avatarHTML(Object.assign({},p,{status:online?(p.status||'online'):'offline'}),'sm',true,'var(--bg-2)')}
      <div class="dm-info">
        <div class="dm-name">${nameHTML(p)}</div>
        <div class="dm-sub ${online?'online-text':''}">${online?(p.customStatus||t('online')):t('offline')}</div>
      </div>`;
    el.onclick = ()=>{ state.activeServer = null; state.activeConv = key; saveState(); render(); };
    el.oncontextmenu = e=>{
      e.preventDefault();
      if (confirm('Удалить @'+u+'?')){ removeFriendRelation(myUsername,u); renderSidebar(); if (state.activeConv === key){ state.activeConv=null; renderMain(); } }
    };
    list.appendChild(el);
  });
}
function renderMain(){
  const main = $('#mainArea');
  main.innerHTML = '';
  if (state.activeServer === null && !state.activeConv){ main.appendChild(buildFriendsPage()); return; }
  if (!state.activeConv){
    main.innerHTML = `<div class="empty-state" style="flex:1"><div class="big">◈</div><div class="title">Выберите чат</div></div>`;
    return;
  }
  main.appendChild(buildChatView());
  setTimeout(renderMessages, 0);
}
function buildFriendsPage(){
  const wrap = document.createElement('div');
  wrap.style.cssText = 'display:flex;flex-direction:column;flex:1;min-height:0';
  const header = document.createElement('div');
  header.className = 'main-header';
  header.innerHTML = `
    <div class="main-tabs">
      <div class="main-tab active" data-tab="friends">👥 ${t('friends')}<span class="main-tab-sep">|</span></div>
      <div class="main-tab" data-tab="online">${t('online')}</div>
      <div class="main-tab" data-tab="all">${t('all')}</div>
      <div class="main-tab" data-tab="pending">${t('waiting')}</div>
      <div class="main-tab primary" id="addFriendTab"><span class="plus">+</span> ${t('add_friend_tab')}</div>
    </div>`;
  wrap.appendChild(header);
  const content = document.createElement('div');
  content.className = 'friends-content';
  content.innerHTML = `
    <div class="search-bar"><input id="friendsSearch" placeholder="${t('search')}"></div>
    <div id="friendsListWrap"></div>`;
  wrap.appendChild(content);
  setTimeout(()=>{
    $('#addFriendTab').onclick = openAddFriendModal;
    $$('.main-tab').forEach(tab => {
      if (tab.classList.contains('primary')) return;
      tab.onclick = ()=>{
        $$('.main-tab').forEach(x => x.classList.remove('active'));
        tab.classList.add('active');
        renderFriendsList(tab.dataset.tab);
      };
    });
    $('#friendsSearch').addEventListener('input', ()=>{
      const active = document.querySelector('.main-tab.active');
      renderFriendsList(active ? active.dataset.tab : 'friends');
    });
    renderFriendsList('friends');
  }, 0);
  return wrap;
}
function renderFriendsList(tab){
  const wrap = $('#friendsListWrap');
  if (!wrap) return;
  const q = ($('#friendsSearch')?.value || '').toLowerCase().trim();
  const friends = getFriendsList(myUsername);
  const requests = allRequests()[myUsername] || [];
  let list = friends;
  if (tab === 'online') list = friends.filter(isOnline);
  else if (tab === 'pending') list = requests.map(r=>r.from);
  const filtered = list.filter(u=>{
    if (!q) return true;
    const p = getProfile(u);
    return u.toLowerCase().includes(q) || (p.displayName||'').toLowerCase().includes(q);
  });
  if (!filtered.length){
    let empty;
    if (tab === 'pending') empty = {title:t('no_requests'),icon:'📭'};
    else if (tab === 'online') empty = {title:t('no_friends_online'),icon:'💤'};
    else if (friends.length) empty = {title:t('nothing_found'),icon:'🔍'};
    else empty = {title:t('no_friends'),desc:t('no_friends_desc'),icon:'👋'};
    wrap.innerHTML = `<div class="empty-state"><div class="big">${empty.icon}</div><div class="title">${esc(empty.title)}</div>${empty.desc ? `<div class="hint">${esc(empty.desc)}</div>` : ''}</div>`;
    return;
  }
  let html = '';
  if (tab === 'friends' || tab === 'all' || tab === 'pending'){
    const online = filtered.filter(isOnline);
    const offline = filtered.filter(u=>!isOnline(u));
    if (online.length){
      html += `<div class="friends-section-title">${t('online')} — ${online.length}</div>`;
      online.forEach(u => { html += friendRowHTML(u); });
    }
    if (offline.length && tab !== 'pending'){
      html += `<div class="friends-section-title">${t('offline')} — ${offline.length}</div>`;
      offline.forEach(u => { html += friendRowHTML(u); });
    }
  } else {
    html += `<div class="friends-section-title">${t('online')} — ${filtered.length}</div>`;
    filtered.forEach(u => { html += friendRowHTML(u); });
  }
  wrap.innerHTML = html;
  $$('#friendsListWrap .friend-row').forEach((row,i)=>{
    row.style.animationDelay = (i * 30) + 'ms';
    const u = row.dataset.user;
    const p = getProfile(u);
    const openDM = ()=>{ state.activeServer = null; state.activeConv = convKeyDM(myUsername,u); saveState(); render(); };
    row.onclick = openDM;
    const callBtn = row.querySelector('[data-call]');
    if (callBtn) callBtn.onclick = (e)=>{ e.stopPropagation(); startCall(p); };
    const msgBtn = row.querySelector('[data-msg]');
    if (msgBtn) msgBtn.onclick = (e)=>{ e.stopPropagation(); openDM(); };
  });
}
function friendRowHTML(u){
  const p = getProfile(u);
  const online = isOnline(u);
  const statusText = online ? (p.customStatus || t('online')) : t('offline');
  return `
    <div class="friend-row" data-user="${esc(u)}">
      <div class="avatar" style="background:linear-gradient(135deg,${p.avatarColor1},${p.avatarColor2})">
        ${p.avatarData ? `<img src="${esc(p.avatarData)}" alt="">` : esc(initials(p.displayName||u))}
        <div class="status-dot ${online?(p.status||'online'):'offline'}"></div>
      </div>
      <div class="friend-info">
        <div class="friend-name">${nameHTML(p)}<span class="handle">@${esc(u)}</span></div>
        <div class="friend-status">${esc(statusText)}</div>
      </div>
      <div class="friend-actions">
        <button class="friend-action-btn" data-msg title="${t('message')}">
          <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        </button>
        <button class="friend-action-btn" data-call title="${t('call')}">
          <svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
        </button>
      </div>
    </div>`;
}
function buildChatView(){
  const conv = state.activeConv;
  const isDM = conv.startsWith('dm:');
  let peer = null;
  if (isDM){
    const ids = conv.slice(3).split('|');
    const other = ids.find(x => x !== myUsername);
    peer = getProfile(other);
  }
  const wrap = document.createElement('div');
  wrap.className = 'chat-view';
  const head = document.createElement('div');
  head.className = 'chat-head';
  if (isDM && peer){
    const online = isOnline(peer.username);
    head.innerHTML = `
      <div style="cursor:pointer" data-profile="${esc(peer.username)}">
        ${avatarHTML(Object.assign({},peer,{status:online?(peer.status||'online'):'offline'}),'sm',true,'var(--bg-3)')}
      </div>
      <div style="cursor:pointer" data-profile="${esc(peer.username)}">
        <div class="name"><span class="dn"></span><span class="handle">@${esc(peer.username)}</span></div>
        <div class="sub">${online?t('online'):t('offline')}</div>
      </div>
      <div class="head-actions">
        <button data-call title="${t('call')}">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
        </button>
      </div>`;
    head.querySelector('.dn').innerHTML = nameHTML(peer);
    head.querySelector('[data-call]').onclick = ()=> startCall(peer);
    head.querySelector('[data-profile]').onclick = ()=> openProfilePopout(peer);
  } else {
    let name = '';
    for (const s of state.servers) for (const c of s.channels) if (convKeyChannel(c.id) === conv) name = c.name;
    head.innerHTML = `<span style="color:var(--text-5);font-size:20px;font-weight:600">#</span><span class="name">${esc(name)}</span>`;
  }
  wrap.appendChild(head);
  const msgs = document.createElement('div');
  msgs.className = 'messages'; msgs.id = 'messages';
  wrap.appendChild(msgs);
  const comp = document.createElement('div');
  comp.className = 'composer';
  const placeholder = isDM && peer ? `${t('type_to')} @${peer.username}` : t('type_message');
  comp.innerHTML = `<div class="composer-inner"><textarea id="msgInput" rows="1" placeholder="${esc(placeholder)}"></textarea><button class="send-btn" id="sendBtn">➤</button></div>`;
  wrap.appendChild(comp);
  setTimeout(()=>{
    const ta = $('#msgInput'), btn = $('#sendBtn');
    if (!ta) return;
    ta.focus();
    ta.addEventListener('input', ()=>{
      ta.style.height = 'auto';
      ta.style.height = Math.min(ta.scrollHeight,200)+'px';
      btn.classList.toggle('show', ta.value.trim().length > 0);
    });
    ta.addEventListener('keydown', e=>{
      if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); sendCurrentMessage(); }
    });
    btn.onclick = sendCurrentMessage;
  }, 0);
  return wrap;
}
function sendCurrentMessage(){
  const conv = state.activeConv;
  if (!conv) return;
  const ta = $('#msgInput'); if (!ta) return;
  const text = ta.value.trim(); if (!text) return;
  ta.value = ''; ta.style.height = 'auto';
  $('#sendBtn').classList.remove('show');
  appendMessage(conv,{id:uid(),from:myUsername,text,time:Date.now()});
  renderMessages();
}
function renderMessages(){
  const box = $('#messages');
  if (!box) return;
  const conv = state.activeConv;
  const list = getMessages(conv);
  box.innerHTML = '';
  if (!list.length){
    box.innerHTML = `<div class="empty-state" style="padding:40px 20px"><div class="big">✦</div><div class="title">Начало беседы</div></div>`;
    return;
  }
  let lastFrom = null, lastTime = 0;
  list.forEach(m=>{
    if (m.sys){
      const s = document.createElement('div');
      s.className = 'sys-msg'; s.textContent = m.text;
      box.appendChild(s);
      lastFrom = null; lastTime = 0;
      return;
    }
    const profile = getProfile(m.from);
    const compact = m.from === lastFrom && (m.time - lastTime) < 5*60*1000;
    const row = document.createElement('div');
    row.className = 'msg' + (compact ? '' : ' group-start');
    const leftSlot = compact ? `<span style="font-size:10px;color:var(--text-5);padding-top:8px;font-family:var(--mono)">${fmtTime(m.time)}</span>`
      : avatarHTML(profile,'',false);
    const head = compact ? '' : `
      <div class="msg-head">
        <span class="msg-author" data-profile="${esc(m.from)}">${nameHTML(profile)}</span>
        <span class="msg-handle">@${esc(m.from)}</span>
        <span class="msg-time">${fmtTime(m.time)}</span>
      </div>`;
    row.innerHTML = `
      <div class="av-slot" data-profile="${esc(m.from)}">${leftSlot}</div>
      <div class="msg-body">${head}<div class="msg-text">${esc(m.text)}</div></div>`;
    box.appendChild(row);
    lastFrom = m.from;
    lastTime = m.time;
  });
  box.scrollTop = box.scrollHeight;
}

function closeModal(){ $('#backdrop').classList.remove('show'); $('#modalContent').innerHTML = ''; }

let settingsOpen = false, settingsTab = 'voice';

function renderSettingsNav(){
  const nav = $('#settingsNav');
  const sections = [
    {group:'SISKORE', items:[
      {id:'account',label:t('account'),ico:'◉'},
      {id:'profile',label:t('profile'),ico:'◐'},
      {id:'voice',label:t('voice_video'),ico:'◊'},
    ]},
    {group:'APP', items:[
      {id:'language',label:t('language'),ico:'⌘'},
    ]},
  ];
  nav.innerHTML = '';
  sections.forEach(sec=>{
    const lbl = document.createElement('div');
    lbl.className = 'settings-nav-section';
    lbl.textContent = sec.group;
    nav.appendChild(lbl);
    sec.items.forEach((it,i)=>{
      const el = document.createElement('div');
      el.className = 'settings-nav-item' + (settingsTab === it.id ? ' active' : '');
      el.style.animationDelay = (i*30) + 'ms';
      el.innerHTML = `<span style="width:18px;text-align:center;font-size:14px">${it.ico}</span><span>${it.label}</span>`;
      el.onclick = ()=>{ settingsTab = it.id; renderSettingsNav(); renderSettingsBody(); };

    });

  out.innerHTML = `<span style="width:18px;text-align:center;font-size:14px">⏻</span><span>${t('logout')}</span>`;
  out.onclick = ()=>{ if (confirm(t('logout')+'?')){ clearSession(); location.reload(); } };
  nav.appendChild(out);
}

function wireVoice(){
  const micSel = $('#micSelect'), camSel = $('#camSelect');
  async function enumerate(){
    try{
      try{ const s = await navigator.mediaDevices.getUserMedia({audio:true}); s.getTracks().forEach(t=>t.stop()); }catch(e){}
      try{ const s = await navigator.mediaDevices.getUserMedia({video:true}); s.getTracks().forEach(t=>t.stop()); }catch(e){}
      const devs = await navigator.mediaDevices.enumerateDevices();
      const mics = devs.filter(d => d.kind === 'audioinput');
      const cams = devs.filter(d => d.kind === 'videoinput');
      const savedMic = userSettings.micDeviceId || '';
      micSel.innerHTML = `<option value="">${t('default_device')}</option>` +
        mics.map(d=>`<option value="${d.deviceId}" ${d.deviceId===savedMic?'selected':''}>${esc(d.label||'Микрофон '+d.deviceId.slice(0,4))}</option>`).join('');
      camSel.innerHTML = `<option value="">${t('default_device')}</option>` +
        (cams.length ? cams.map(d=>`<option value="${d.deviceId}">${esc(d.label||'Камера')}</option>`).join('') : `<option disabled>${t('not_set')}</option>`);
    }catch(e){}
  }
  enumerate();
  if (navigator.mediaDevices && navigator.mediaDevices.addEventListener){
    navigator.mediaDevices.addEventListener('devicechange', enumerate);
  }
  micSel.onchange = ()=>{
    userSettings.micDeviceId = micSel.value || null;
    saveUserSettings();
    if (micStream) startMicTest();
    toast('Микрофон', 'Устройство выбрано', 'success', 2000);
  };
  $('#micTestBtn').onclick = ()=>{ if (micStream) stopMicTest(); else startMicTest(); };
  $('#camTestBtn').onclick = ()=>{ if (cameraStream) stopCameraTest(); else startCameraTest(); };
  $('#setNoise').onchange = e => { userSettings.noiseSuppression = e.target.checked; saveUserSettings(); toast('Шумоподавление', e.target.checked?'Включено':'Выключено','success',1500); };
  $('#setEcho').onchange = e => { userSettings.echoCancellation = e.target.checked; saveUserSettings(); };
  $('#setGain').onchange = e => { userSettings.autoGainControl = e.target.checked; saveUserSettings(); };
  $('#setFps').onchange = e => { userSettings.screenFps = parseInt(e.target.value, 10); saveUserSettings(); toast('FPS демонстрации', userSettings.screenFps + ' FPS', 'success', 1500); };

  async function startMicTest(){
    stopMicTest();
    try{
      const constraints = { audio: {
        echoCancellation: userSettings.echoCancellation,
        noiseSuppression: userSettings.noiseSuppression,
        autoGainControl: userSettings.autoGainControl,
      }};
      if (userSettings.micDeviceId) constraints.audio.deviceId = { exact: userSettings.micDeviceId };
      micStream = await navigator.mediaDevices.getUserMedia(constraints);
      micAC = new (window.AudioContext||window.webkitAudioContext)();
      const src = micAC.createMediaStreamSource(micStream);
      micAnalyser = micAC.createAnalyser(); micAnalyser.fftSize = 512; micAnalyser.smoothingTimeConstant = .78;
      src.connect(micAnalyser); micData = new Uint8Array(micAnalyser.frequencyBinCount);
      const loop = ()=>{
        if (!micAnalyser) return;
        micAnalyser.getByteFrequencyData(micData);
        let s = 0; for (let i=0;i<micData.length;i++) s += micData[i];
        const el = $('#micLevel'); if (el) el.style.width = Math.min(100,(s/micData.length)*1.4)+'%';
        micRAF = requestAnimationFrame(loop);
      };
      loop();
      $('#micTestBtn').textContent = t('stop_test');
      toast('Микрофон активен', 'Шумоподавление: ' + (userSettings.noiseSuppression?'ON':'OFF'), 'success', 2000);
    }catch(e){ toast('Ошибка', e.message, 'error'); }
  }
  function stopMicTest(){
    if (micRAF){ cancelAnimationFrame(micRAF); micRAF = null; }
    if (micStream){ micStream.getTracks().forEach(t=>t.stop()); micStream = null; }
    if (micAC){ try{ micAC.close(); }catch(e){} micAC = null; }
    micAnalyser = null;
    const el = $('#micLevel'); if (el) el.style.width = '0%';
    const b = $('#micTestBtn'); if (b) b.textContent = t('test_mic');
  }
  window.__stopMicTest = stopMicTest;

  async function startCameraTest(){
    stopCameraTest();
    try{
      cameraStream = await navigator.mediaDevices.getUserMedia({video:{width:1280,height:720}});
      const v = $('#camVideo');
      v.srcObject = cameraStream;
      $('#camPreview').classList.add('live');
      $('#camTestBtn').textContent = 'Стоп';
      lastCamT = performance.now(); camFrames = 0;
      const loop = ()=>{
        camFrames++;
        const now = performance.now();
        if (now - lastCamT >= 1000){
          const el = $('#camFps'); if (el) el.textContent = Math.round((camFrames*1000)/(now-lastCamT)) + ' FPS';
          camFrames = 0; lastCamT = now;
        }
        if (v.requestVideoFrameCallback) cameraRAF = v.requestVideoFrameCallback(loop);
        else cameraRAF = requestAnimationFrame(loop);
      };
      if (v.requestVideoFrameCallback) v.requestVideoFrameCallback(loop);
      else requestAnimationFrame(loop);
    }catch(e){ toast('Ошибка', e.message, 'error'); }
  }
  function stopCameraTest(){
    if (cameraRAF){
      const v = $('#camVideo');
      if (v && v.cancelVideoFrameCallback) try{ v.cancelVideoFrameCallback(cameraRAF); }catch(e){}
      else cancelAnimationFrame(cameraRAF);
      cameraRAF = null;
    }
    if (cameraStream){ cameraStream.getTracks().forEach(t=>t.stop()); cameraStream = null; }
    const v = $('#camVideo'); if (v) v.srcObject = null;
    $('#camPreview').classList.remove('live');
    const b = $('#camTestBtn'); if (b) b.textContent = 'Включить камеру';
  }
  window.__stopCameraTest = stopCameraTest;
}
const stopMicTest = () => window.__stopMicTest && window.__stopMicTest();
const stopCameraTest = () => window.__stopCameraTest && window.__stopCameraTest();
